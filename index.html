<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6d3e4">
<meta name="description" content="La última misión de Aurora: una aventura para futuras maestras.">
<title>La última misión de Aurora</title>
<style>
/* =========================================================
   ESTILOS · Mobile-first
   ========================================================= */
:root{
  --fondo:#fff8f1;
  --texto:#33283f;
  --suave:#5f526d;
  --primario:#6a3d9e;
  --primario-osc:#522d7d;
  --rosa:#fbd3e3;
  --menta:#cdeedd;
  --cielo:#d6e8fb;
  --amarillo:#fff0b3;
  --lila:#e9def8;
  --durazno:#ffe0cc;
  --blanco:#ffffff;
  --borde:#eadff0;
  --exito:#1d6e46;
  --error:#a8221a;
  --radio:20px;
  --sombra:0 4px 14px rgba(106,61,158,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:17px;line-height:1.5;color:var(--texto);
  background:linear-gradient(180deg,#fde7f1 0%,var(--fondo) 30%,#eef5ff 100%);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.pantalla{animation:aparecer .3s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
p{margin:0 0 .7em}
small{color:var(--suave)}

/* ---------- Aurora ---------- */
.aurora-img{display:block;object-fit:cover;background:var(--lila);border-radius:50%;border:4px solid #fff;box-shadow:var(--sombra)}
.aurora-img.grande{width:170px;height:170px;margin:8px auto 12px;animation:flotar 4s ease-in-out infinite}
.aurora-img.mini{width:64px;height:64px;flex:none;border-width:3px}
.aurora-fallback{display:flex;align-items:center;justify-content:center}
.aurora-fallback.grande{font-size:84px}
.aurora-fallback.mini{font-size:34px}
.aurora-fila{display:flex;gap:12px;align-items:flex-start;margin:6px 0 16px}
.globo{position:relative;background:var(--blanco);border-radius:18px;padding:12px 14px;box-shadow:var(--sombra);border:2px solid var(--borde);flex:1}
.globo p:last-child{margin-bottom:0}
.globo .quien{display:block;font-weight:800;color:var(--primario);font-size:.85rem;margin-bottom:2px}

/* ---------- Tarjetas y textos ---------- */
.titulo-app{text-align:center;font-size:1.75rem;color:var(--primario-osc)}
.subtitulo{text-align:center;color:var(--suave);margin-top:-4px}
.tarjeta{background:var(--blanco);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin:0 0 16px;border:2px solid var(--borde)}
.tarjeta.destacada{background:var(--amarillo);border-color:#f2dc86}
.tarjeta h3{font-size:1.1rem;color:var(--primario-osc)}
.pie{text-align:center;font-size:.85rem;color:var(--suave);margin-top:18px}
.ayuda{font-size:.9rem;color:var(--suave);margin:10px 0 0}
.error{color:var(--error);font-weight:600;font-size:.95rem;min-height:1.2em;margin:6px 0}
.aviso{background:var(--durazno);border:2px solid #f5c3a3;border-radius:16px;padding:12px;font-size:.95rem;margin-bottom:16px}

/* ---------- Formularios ---------- */
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;min-height:52px;padding:12px 14px;border:2px solid #cdbde0;border-radius:14px;background:#fff;font-size:1.05rem}
input[type=text]:focus{outline:3px solid #c9a7f0;border-color:var(--primario)}

/* ---------- Botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;margin:10px 0 0;border:2px solid transparent;border-radius:16px;font-size:1.05rem;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .1s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid #f49ac1;outline-offset:2px}
.btn-primario{background:var(--primario);color:#fff}
.btn-primario:hover{background:var(--primario-osc)}
.btn-secundario{background:#fff;color:var(--primario-osc);border-color:var(--primario)}
.btn-suave{background:var(--lila);color:var(--primario-osc)}
.btn-texto{background:transparent;color:var(--primario-osc);text-decoration:underline;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Progreso ---------- */
.barra{height:14px;background:#efe7f6;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.barra>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f49ac1,#a77fd6);border-radius:99px;transition:width .5s ease}

/* ---------- Mapa de fases ---------- */
.lista-fases{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.fase-card{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;text-align:left;background:#fff;border:2px solid var(--borde);border-left:10px solid var(--color-fase,#ddd);border-radius:18px;box-shadow:var(--sombra);cursor:pointer;touch-action:manipulation}
.fase-card:active{transform:scale(.99)}
.fase-card[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.fase-card.sugerida{border-color:var(--primario);border-left-color:var(--color-fase,#ddd);box-shadow:0 0 0 3px #e4d2fa}
.fase-card.completada{background:#f1fbf5}
.fase-emoji{font-size:30px;width:44px;text-align:center;flex:none}
.fase-info{flex:1;display:flex;flex-direction:column;line-height:1.25}
.fase-info strong{font-size:1.02rem}
.fase-insignia{font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--lila);color:var(--primario-osc);white-space:nowrap;flex:none}
.completada .fase-insignia{background:var(--menta);color:var(--exito)}
.proximamente .fase-insignia{background:var(--amarillo);color:#6b5200}

/* ---------- Pantalla de fase ---------- */
.fase-cabecera{display:flex;gap:14px;align-items:center;background:var(--color-fase,#eee);border-radius:var(--radio);padding:16px;margin-bottom:12px}
.fase-cabecera .emoji-grande{font-size:44px;flex:none}
.fase-cabecera h2{font-size:1.35rem;margin:0}
.fase-cabecera p{margin:0;color:var(--suave)}
.zona-juego{margin:0 0 16px}
.construccion{text-align:center;background:repeating-linear-gradient(45deg,#fffaf0,#fffaf0 14px,#fff3d6 14px,#fff3d6 28px);border:2px dashed #e7c66b}
.construccion .icono{font-size:46px;display:block}
.acciones-fase{display:flex;flex-direction:column}

/* ---------- Mapa: misión actual (sorpresa) y logros ---------- */
.mision-actual{position:relative;overflow:hidden;background:#fff;border:3px solid var(--primario);border-radius:24px;padding:22px 18px 18px;box-shadow:0 6px 20px rgba(106,61,158,.18);margin:0 0 18px;text-align:center}
.mision-actual::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--color-fase,#e9def8)}
.mision-actual .emoji-mision{font-size:54px;display:block;margin:10px 0 2px}
.mision-actual h2{font-size:1.35rem;color:var(--primario-osc);margin:2px 0 0}
.etiqueta-nueva{display:inline-block;background:linear-gradient(90deg,#d94f8f,#7d4fc0);color:#fff;font-weight:800;padding:6px 14px;border-radius:99px;font-size:.95rem}
.mision-actual.nueva{animation:revelar .7s ease-out}
.mision-actual.nueva .etiqueta-nueva{animation:latido 1.2s ease-in-out 2 .7s}
@keyframes revelar{0%{opacity:0;transform:scale(.85) rotate(-2deg)}60%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btn-mision{font-size:1.15rem;min-height:60px;margin-top:16px}
.seccion-titulo{font-size:1.05rem;color:var(--primario-osc);margin:4px 0 10px}
.lista-logros{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:10px}
.logro{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;text-align:left;background:#f1fbf5;border:2px solid #bfe6cf;border-radius:18px;cursor:pointer;touch-action:manipulation}
.logro:active{transform:scale(.99)}
.logro .check{font-size:28px;flex:none}
.logro .msg{color:var(--exito);font-weight:600;font-size:.92rem}
.sorpresas{text-align:center;color:var(--suave);font-style:italic;margin:8px 0 16px}
.consulta{background:var(--menta);border:2px solid #9fd8b7;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-weight:600;color:var(--exito)}

/* ---------- Fase 1 · Sopa de letras ---------- */
.sopa-tarjeta{padding:10px}
.sopa-contador{text-align:center;font-weight:800;color:var(--primario-osc);margin:2px 0 0}
.sopa-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;width:100%;margin:10px 0 6px;padding:4px;background:#e9def8;border-radius:12px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.sopa-celda{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:5px;font-weight:800;line-height:1;
  font-size:calc((min(100vw,560px) - 76px) / var(--n) * .6);color:var(--texto);transition:background .12s}
.sopa-celda.encontrada{background:var(--color-palabra,#cdf2dc)}
.sopa-celda.sel{background:#8c5cc7;color:#fff}
.sopa-celda.ancla{background:#8c5cc7;color:#fff;box-shadow:inset 0 0 0 3px #fff}
.sopa-grid.error .sopa-celda.sel{background:#d9534f}
.sopa-celda.pista{animation:pistaBrillo .9s ease-in-out infinite;background:#ffd84d;color:var(--texto)}
.sopa-celda.pop{animation:pop .5s ease}
@keyframes pistaBrillo{0%,100%{box-shadow:inset 0 0 0 0 #e0a800}50%{box-shadow:inset 0 0 0 4px #e0a800}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.sopa-lista{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:340px){.sopa-lista{grid-template-columns:1fr}}
.sopa-lista li{padding:10px 12px;border-radius:12px;background:#f7f3fb;border:2px solid var(--borde);font-weight:700;font-size:.95rem;letter-spacing:.02em;word-break:break-word}
.sopa-lista li.ok{background:var(--color-palabra,#cdf2dc);border-color:transparent}
.sopa-lista li.ok .txt{text-decoration:line-through;text-decoration-thickness:2px}
.tarjeta-palabra{border-left:6px solid var(--color-palabra,#cdf2dc);background:#fcfaff;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.tarjeta-palabra p{margin:4px 0 0;font-size:.95rem}
select,textarea{width:100%;border:2px solid #cdbde0;border-radius:14px;background:#fff;padding:12px 14px;font-size:1.02rem}
select{min-height:52px}
textarea{resize:vertical;min-height:140px;line-height:1.45}
select:focus,textarea:focus{outline:3px solid #c9a7f0;border-color:var(--primario)}

/* ---------- Fase 2 · Memoria ---------- */
.mem-panel{padding:12px}
.mem-marcadores{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--primario-osc)}
.mem-marcadores .neutro{font-weight:600;font-size:.9rem;color:var(--suave)}
.mem-mensaje{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;margin:4px 0;font-weight:800;color:var(--exito);text-align:center;opacity:0;transition:opacity .3s}
.mem-mensaje.visible{opacity:1}
.aurora-img.diminuta{width:36px;height:36px;border-width:2px;flex:none}
.aurora-fallback.diminuta{font-size:20px}
.mem-tablero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.mem-tablero{grid-template-columns:repeat(4,1fr)}}
.mem-carta{position:relative;display:block;width:100%;aspect-ratio:3/4;min-height:112px;padding:0;margin:0;border:0;background:transparent;perspective:900px;cursor:pointer;touch-action:manipulation;font:inherit;color:inherit}
.mem-interior{position:absolute;inset:0;display:block;transition:transform .45s ease;transform-style:preserve-3d}
.mem-carta.volteada .mem-interior{transform:rotateY(180deg)}
.mem-cara{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;border-radius:14px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--sombra)}
.mem-dorso{background:var(--fondo-carta,#e9def8);border:3px solid #fff;
  background-image:radial-gradient(circle at 18% 18%,rgba(255,255,255,.75) 0 7px,transparent 8px),radial-gradient(circle at 82% 82%,rgba(255,255,255,.6) 0 10px,transparent 11px)}
.mem-signo{display:flex;align-items:center;justify-content:center;width:52%;aspect-ratio:1/1;border-radius:50%;background:rgba(255,255,255,.85);color:var(--primario);font-weight:900;font-size:clamp(24px,8vw,38px)}
.mem-frente{transform:rotateY(180deg);background:#fff;border:3px solid var(--fondo-carta,#e9def8);text-align:center}
.mem-frente small{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--suave);margin-bottom:4px}
.mem-texto{font-size:clamp(.7rem,3.15vw,.9rem);line-height:1.22;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.mem-frente.concepto .mem-texto{font-weight:800;color:var(--primario-osc);font-size:clamp(.78rem,3.6vw,1rem)}
.mem-carta.encontrada .mem-frente{background:#effaf3;border-color:#7cc99d}
.mem-carta.encontrada .mem-frente::after{content:"✓";position:absolute;top:3px;right:7px;color:var(--exito);font-weight:900}
.mem-carta.pop{animation:popCarta .5s ease}
.mem-carta.pista .mem-frente{box-shadow:0 0 0 4px #ffd84d inset}
.mem-carta.brillo{animation:brilloCarta .8s ease-in-out infinite}
.mem-tablero.celebrar .mem-carta{animation:saltito .6s ease 2}
.mem-carta:focus-visible{outline:3px solid #f49ac1;outline-offset:2px;border-radius:14px}
@keyframes popCarta{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes brilloCarta{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.06);filter:drop-shadow(0 0 8px #ffc61a)}}
@keyframes saltito{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mem-celebracion{text-align:center;background:var(--amarillo);border-color:#f2dc86}
.mem-celebracion .confeti{font-size:34px;letter-spacing:6px;display:block;margin-bottom:6px}
.mem-relaciones{display:flex;flex-direction:column;gap:8px}
.mem-relacion{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:#fcfaff;border-left:6px solid var(--fondo-carta,#e9def8)}
.mem-relacion strong{color:var(--primario-osc)}

/* ---------- Fase 3 · Crucigrama ---------- */
.cru-pista{position:sticky;top:6px;z-index:6;background:#fff;border:2px solid var(--primario);border-radius:16px;padding:10px 12px;margin:0 0 12px;box-shadow:0 4px 14px rgba(106,61,158,.18)}
.cru-ref{display:inline-block;font-weight:800;font-size:.78rem;color:#fff;background:var(--primario);border-radius:99px;padding:2px 10px;margin-bottom:4px}
.cru-pista p{margin:0;font-weight:600;line-height:1.35}
.cru-panel{padding:12px}
.cru-marco{position:relative;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.cru-grid{display:grid;grid-template-columns:repeat(var(--cols),var(--tam,32px));grid-auto-rows:var(--tam,32px);gap:2px;width:max-content;margin:0 auto;padding:4px;background:#e9def8;border-radius:12px;user-select:none;-webkit-user-select:none}
.cru-vacia{background:transparent}
.cru-celda{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:5px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 1px #d6c6ea;transition:background .12s}
.cru-n{position:absolute;top:1px;left:3px;font-size:max(8.5px, calc(var(--tam,32px) * .3));font-weight:700;color:var(--suave);line-height:1}
.cru-l{font-weight:800;font-size:calc(var(--tam,32px) * .56);line-height:1;color:var(--texto)}
.cru-celda.correcta{background:#cdf2dc}
.cru-celda.revisar{background:#ffe3c2}
.cru-celda.en-palabra:not(.correcta):not(.revisar){background:#efe4fb}
.cru-celda.en-palabra{box-shadow:inset 0 0 0 2px #b18ee0}
.cru-celda.activa{background:#c9a7f0 !important;box-shadow:inset 0 0 0 3px var(--primario)}
.cru-celda.revelada .cru-l{color:#1d6e46}
.cru-celda.revelada::after{content:"";position:absolute;bottom:3px;left:30%;right:30%;height:2px;border-radius:2px;background:#e0a800}
.cru-celda.pop{animation:pop .5s ease}
.cru-grid.celebrar .cru-celda{animation:saltito .6s ease 2}
input.cru-entrada[type=text]{position:absolute;left:0;top:0;width:1px;height:1px;min-height:0;padding:0;border:0;opacity:0;font-size:16px;caret-color:transparent;pointer-events:none;outline:none}
.cru-mensaje{min-height:24px;margin:8px 0 0;text-align:center;font-weight:700;color:var(--exito)}
.cru-acciones{display:flex;gap:8px;margin-top:6px}
.cru-acciones .btn{margin:0;flex:1;min-height:46px;font-size:.98rem}
.cru-teclado{display:flex;flex-direction:column;gap:6px;margin-top:10px;user-select:none;-webkit-user-select:none}
.cru-fila{display:flex;gap:4px;justify-content:center}
.cru-tecla{flex:1;max-width:44px;min-height:46px;padding:0;border:0;border-radius:10px;background:#f3ecfb;color:var(--primario-osc);font-weight:800;font-size:1.05rem;box-shadow:0 2px 0 #d6c6ea;cursor:pointer;touch-action:manipulation}
.cru-tecla:active{transform:translateY(1px);background:#e2d3f6}
.cru-tecla.ancha{flex:1.6;max-width:72px}
.cru-lista{list-style:none;padding:0;margin:0 0 14px}
.cru-lista li{padding:8px 10px;margin-bottom:6px;border-radius:10px;background:#faf7fd;border:2px solid transparent;cursor:pointer;font-size:.95rem;line-height:1.35}
.cru-lista li.activa{border-color:var(--primario);background:#f3ecfb}
.cru-lista li.resuelta{background:#effaf3}
.cru-lista li.resuelta::before{content:"✅ "}

/* ---------- Fase 6 · Cacería de evidencias ---------- */
.ev-reto{padding:14px}
.ev-reto.ok{border-color:#9fd8b7;background:#fbfffc}
.ev-cab{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.ev-num{flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--durazno);color:var(--primario-osc);font-weight:900;font-size:1.1rem}
.ev-reto.ok .ev-num{background:var(--menta);color:var(--exito)}
.ev-cab h3{margin:0;font-size:1.08rem;color:var(--primario-osc)}
.ev-estado{font-size:.85rem;font-weight:700;color:var(--suave)}
.ev-reto.ok .ev-estado{color:var(--exito)}
.ev-alt{font-size:.9rem;background:#f7f3fb;border-radius:12px;padding:8px 10px;margin:6px 0}
.ev-foto{margin:10px 0 2px}
.ev-foto img,.ev-item img{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:#f4eefa;border:3px solid #fff;box-shadow:var(--sombra)}
.ev-foto img.ev-previa{outline:3px dashed #e0a800;outline-offset:3px}
.ev-vacia{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;border:2px dashed #e6cdb5;border-radius:14px;background:#fffaf4;color:var(--suave);font-size:.92rem;text-align:center;padding:10px}
.ev-vacia span{font-size:34px}
.ev-tira{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ev-tira img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid #fff;box-shadow:var(--sombra)}
.ev-galeria{display:flex;flex-direction:column;gap:14px}
.ev-reto.especial{background:linear-gradient(180deg,#fff 0%,#fff4f8 100%);border:3px solid #f49ac1;box-shadow:0 0 0 4px #fde3ef,var(--sombra)}
.ev-reto.especial .ev-num{background:#f49ac1;color:#fff}
.ev-reto.especial.ok .ev-num{background:#d9467f}
.tarjeta-ampliar{background:var(--amarillo);border-color:#f2dc86}
.ev-item strong{display:block;color:var(--primario-osc);margin-bottom:6px}

/* ---------- Fase 4 · Defiende tu planificación ---------- */
.pl-sit{padding:14px}
.pl-cab{display:flex;justify-content:space-between;align-items:center}
.pl-num{display:inline-block;background:var(--cielo);color:var(--primario-osc);font-weight:800;font-size:.85rem;border-radius:99px;padding:4px 12px}

/* =========================================================
   6. MOTORES DE JUEGOS
   Cada fase se activa registrando un motor. Mientras una fase
   no tenga motor, se muestra como "Próximamente" y NUNCA se
   marca como completada.

   Interfaz de un motor:
   registrarMotor('sopa', {
     asignar(azar, bancos) { ... return asignacion },   // Se llama UNA vez; se guarda en el progreso
     iniciar(contenedor, api) { ... },                  // Dibuja el juego dentro de "contenedor"
     pista(api) { ... return 'texto de la pista' },     // Opcional
     reiniciar(contenedor, api) { ... },                // Opcional (si no existe, se llama a iniciar)
     pistaDisponible(api) { return true | 'texto' },    // Opcional: evita pistas en mal momento
     alCerrarPista(api) { ... },                        // Opcional: ayuda visual tras cerrar la pista
     mensajeReinicio(api) { return 'texto' }            // Opcional: aviso propio al reiniciar
   });

   La "api" ofrece:
     api.nombre, api.config, api.fase, api.estadoFase, api.asignacion,
     api.respuestas            -> respuestas del intento actual
     api.responder(clave, valor) -> guarda una respuesta
     api.registrarEvento(texto, datos) -> anota algo en el intento
     api.agregarEvidencia(evidencia) -> guarda foto comprimida y devuelve su id
     api.quitarEvidencia(id)   -> elimina una foto de ESTA misión (reemplazo/reinicio)
     api.completar(resultado, {mensaje, boton, permanecer, actualizarResultado}) -> marca la fase como completada
                               (mensaje y botón opcionales; permanecer:true guarda sin ventana
                               ni regreso automático, para que el juego muestre su propio cierre)
     api.aurora(texto)         -> mensaje de Aurora en una ventana
     api.registrarPista(texto) -> registra una ayuda dada desde el propio juego
     api.guardar()             -> fuerza el guardado

   Convenciones para que el recorrido final (fase 9) y el
   informe muestren datos reales:
     - Respuestas escritas: api.responder('p1', { pregunta:'…', respuesta:'…' })
       (también se aceptan textos simples).
     - Fotografías: api.agregarEvidencia({ imagen: dataURL, reto:'…', descripcion:'…' })
   ========================================================= */
const MOTORES = {};
function registrarMotor(faseId, motor){
  if (!FASES.some(f => f.id === faseId)) { console.warn('Fase desconocida:', faseId); return; }
  MOTORES[faseId] = motor;
}
function estaImplementada(faseId){ return !!MOTORES[faseId]; }

   7. UTILIDADES
   ========================================================= */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
function esc(t){
  return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ahoraISO(){ return new Date().toISOString(); }
function fechaLegible(iso){
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('es-GT', { dateStyle:'medium', timeStyle:'short' }); }
  catch (e) { return String(iso); }
}
function horaCorta(iso){
  try { return new Date(iso).toLocaleTimeString('es-GT', { hour:'2-digit', minute:'2-digit' }); }
  catch (e) { return ''; }
}
function limpiarNombre(n){ return String(n || '').replace(/\s+/g, ' ').trim(); }
function primerNombre(n){ return limpiarNombre(n).split(' ')[0] || ''; }
function slug(t){
  return String(t || 'estudiante').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 40) || 'estudiante';
}
function generarId(){ return 'av-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function copiaProfunda(o){ return JSON.parse(JSON.stringify(o)); }
function sello(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

/* Aleatoriedad: se usa SOLO al asignar contenido por primera vez. */
const Azar = {
  entero(max){
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max;
    }
    return Math.floor(Math.random() * max);
  },
  barajar(lista){
    const a = Array.isArray(lista) ? lista.slice() : [];
    for (let i = a.length - 1; i > 0; i--) { const j = this.entero(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  },
  elegir(lista, n){ return this.barajar(lista).slice(0, n); }
};

   8. ESTADO DE LA ESTUDIANTE
   ========================================================= */
let estado = null;          // Aventura activa
let estadoGuardado = null;  // Aventura encontrada al abrir la página
let pantallaActual = 'bienvenida';

function crearEstadoFase(){
  return {
    estado: 'pendiente',   // pendiente | en_curso | completada
    asignacion: null,      // Contenido aleatorio asignado (se conserva siempre)
    respuestas: {},        // Respuestas del intento actual
    intentos: [],          // Historial completo de intentos (nunca se borra)
    pistas: [],            // Pistas utilizadas
    resultado: null,
    fechaInicio: null,
    fechaFin: null
  };
}

function crearEstadoNuevo(nombre){
  const e = {
    app: APP.id,
    version: APP.version,
    id: generarId(),
    nombre: nombre,
    fechaInicio: ahoraISO(),
    fechaFinalizacion: null,
    actualizado: ahoraISO(),
    faseActual: null,
    fases: {},
    evidencias: [],
    historial: []
  };
  FASES.forEach(f => { e.fases[f.id] = crearEstadoFase(); });
  return e;
}

/* Completa campos faltantes (p. ej. respaldos de versiones anteriores) */
function normalizarEstado(e){
  e.nombre = limpiarNombre(e.nombre);
  if (!Array.isArray(e.historial)) e.historial = [];
  // Migración de respaldos con la estructura anterior (10 misiones)
  const versionAnterior = Number(e.version) || 1;
  if (e.fases && typeof e.fases === 'object' && !Array.isArray(e.fases)) {
    FASES_ELIMINADAS.forEach(id => {
      if (e.fases[id]) {
        e.fasesEliminadas = e.fasesEliminadas || {};
        e.fasesEliminadas[id] = e.fases[id];          // Se conserva, pero ya no forma parte de la aventura
        delete e.fases[id];
      }
    });
  }
  if (FASES_ELIMINADAS.includes(e.faseActual)) e.faseActual = null;
  if (versionAnterior < 2) {
    e.historial.push({ fecha: ahoraISO(), tipo: 'migracion', fase: null,
      texto: 'La aventura se actualizó a 8 misiones. Se conservó todo el progreso anterior.' });
  }
  if (!e.id) e.id = generarId();
  if (!e.fechaInicio) e.fechaInicio = ahoraISO();
  if (!e.fases || typeof e.fases !== 'object' || Array.isArray(e.fases)) e.fases = {};
  FASES.forEach(f => {
    const actual = e.fases[f.id];
    const fe = Object.assign(crearEstadoFase(), (actual && typeof actual === 'object') ? actual : {});
    if (!Array.isArray(fe.intentos)) fe.intentos = [];
    if (!Array.isArray(fe.pistas)) fe.pistas = [];
    if (!fe.respuestas || typeof fe.respuestas !== 'object') fe.respuestas = {};
    if (!['pendiente','en_curso','completada'].includes(fe.estado)) fe.estado = 'pendiente';
    e.fases[f.id] = fe;
  });
  if (!Array.isArray(e.evidencias)) e.evidencias = [];
  if (!Array.isArray(e.historial)) e.historial = [];
  e.app = APP.id;
  e.version = APP.version;
  return e;
}

function agregarHistorial(tipo, texto, faseId){
  if (!estado) return;
  estado.historial.push({ fecha: ahoraISO(), tipo, fase: faseId || null, texto });
}

function tieneProgreso(e){
  if (!e) return false;
  return e.historial.length > 1 || e.evidencias.length > 0 ||
    FASES.some(f => e.fases[f.id] && e.fases[f.id].estado !== 'pendiente');
}

/* ---------- Reglas estrictas de desbloqueo ----------
   - Una fase cuenta como completada solo si tiene motor implementado
     Y su estado es "completada" (protege contra JSON alterados).
   - La misión actual es la PRIMERA fase no completada.
   - Solo se puede abrir la misión actual o una fase ya completada.
   - Una fase sin motor no puede completarse, así que bloquea a las
     siguientes: no es posible saltarla. */
function faseCompletada(faseId){
  if (!estado) return false;
  const fe = estado.fases[faseId];
  if (fe.estado !== 'completada') return false;
  if (fe.completadaEnPrueba) return modoPruebaActivo();   // Completada con el botón de prueba
  return estaImplementada(faseId);
}
function indiceMisionActual(){
  for (let i = 0; i < FASES.length; i++) {
    if (!faseCompletada(FASES[i].id)) return i;
  }
  return FASES.length; // Toda la aventura completada
}
function faseDesbloqueada(indice){
  if (!estado || !Number.isInteger(indice) || indice < 0 || indice >= FASES.length) return false;
  return indice <= indiceMisionActual();
}

function intentoAbierto(fe){
  return fe.intentos.find(i => i.estado === 'en_curso') || null;
}
function iniciarIntento(fe){
  const intento = { numero: fe.intentos.length + 1, estado: 'en_curso', inicio: ahoraISO(), fin: null,
                    respuestas: {}, pistas: 0, eventos: [], resultado: null };
  fe.intentos.push(intento);
  fe.respuestas = {};
  return intento;
}
function cerrarIntento(fe, nuevoEstado, resultado){
  const intento = intentoAbierto(fe);
  if (!intento) return null;
  intento.estado = nuevoEstado;           // reiniciado | completado
  intento.fin = ahoraISO();
  intento.respuestas = copiaProfunda(fe.respuestas || {});
  if (resultado !== undefined) intento.resultado = resultado;
  return intento;
}

/* ---------- Modo prueba docente ----------
   Solo funciona si CONFIG_DOCENTE.MODO_PRUEBA_DOCENTE === true Y la aventura
   abierta es el perfil de prueba (estado.perfilPrueba === true). La aventura
   real de una estudiante nunca puede completarse con estos botones. */
const NOMBRE_PERFIL_PRUEBA = 'Docente (perfil de prueba)';
function modoPruebaActivo(){
  return CONFIG_DOCENTE.MODO_PRUEBA_DOCENTE === true && !!estado && estado.perfilPrueba === true;
}
function crearPerfilPrueba(){
  const e = crearEstadoNuevo(NOMBRE_PERFIL_PRUEBA);
  e.perfilPrueba = true;
  return e;
}
async function entrarPerfilPrueba(){
  if (CONFIG_DOCENTE.MODO_PRUEBA_DOCENTE !== true) return;
  let previo = null;
  try { previo = await Persistencia.cargarPrueba(); } catch (e) {}
  estado = previo && previo.perfilPrueba === true && validarRespaldo(previo).ok ? normalizarEstado(previo) : crearPerfilPrueba();
  agregarHistorial('prueba', 'El docente entró al perfil de prueba.');
  await guardarAhora();
  mostrarMenu();
}
async function completarFasePrueba(faseId){
  if (!modoPruebaActivo()) return;                       // Nunca en la aventura real
  const fase = FASES.find(f => f.id === faseId);
  if (!fase) return;
  const indice = FASES.indexOf(fase);
  if (indice !== indiceMisionActual()) return;            // Solo la misión actual, en orden
  const fe = estado.fases[fase.id];
  if (intentoAbierto(fe)) cerrarIntento(fe, 'cerrado en modo prueba');
  fe.estado = 'completada';
  fe.completadaEnPrueba = true;
  fe.fechaInicio = fe.fechaInicio || ahoraISO();
  fe.fechaFin = ahoraISO();
  fe.resultado = { modo: 'Completada en modo prueba', fecha: fe.fechaFin };   // Sin respuestas ni fotos ficticias
  agregarHistorial('prueba', `Fase ${fase.numero} «${fase.titulo}»: Completada en modo prueba.`, fase.id);
  if (indiceMisionActual() >= FASES.length && !estado.fechaFinalizacion) estado.fechaFinalizacion = ahoraISO();
  await guardarAhora();
  toast(`🧪 Fase ${fase.numero} completada en modo prueba`);
  volverAlMapa();
}
async function reiniciarPruebas(){
  if (!modoPruebaActivo()) return;
  const r = await dialogo({
    titulo: '🧪 Reiniciar pruebas',
    mensaje: 'El perfil de prueba volverá a la misión 1. La aventura real de las estudiantes guardada en este dispositivo no se modifica.',

/* =========================================================
   9. PERSISTENCIA (IndexedDB principal + localStorage auxiliar)
   ========================================================= */
const Persistencia = {
  db: null,
  disponible: false,
  NOMBRE_BD: 'aurora_aventura',
  CLAVE: 'actual',
  CLAVE_PRUEBA: 'prueba_docente',   // Perfil de prueba del docente (separado de la aventura real)

  abrir(){
    return new Promise(resolve => {
      if (!('indexedDB' in window)) return resolve(false);
      let req;
      try { req = indexedDB.open(this.NOMBRE_BD, 1); } catch (e) { return resolve(false); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('estado')) db.createObjectStore('estado');
      };
      req.onsuccess = () => { this.db = req.result; this.disponible = true; resolve(true); };
      req.onerror = () => resolve(false);
      req.onblocked = () => resolve(false);
    });
  },

  _operacion(modo, fn){
    return new Promise((resolve, reject) => {
      let tx;
      try { tx = this.db.transaction('estado', modo); } catch (e) { return reject(e); }
      const req = fn(tx.objectStore('estado'));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },

  async guardar(e){
    let ok = false;
    const prueba = e.perfilPrueba === true;
    if (this.disponible) {
      try { await this._operacion('readwrite', st => st.put(e, prueba ? this.CLAVE_PRUEBA : this.CLAVE)); ok = true; }
      catch (err) { console.error('IndexedDB:', err); }
    }
    if (prueba) {
      // El perfil de prueba nunca escribe en las claves de la aventura real
      if (!ok) { try { localStorage.setItem('aurora_prueba_respaldo', JSON.stringify(e)); ok = true; } catch (err) {} }
      return ok;
    }
    // localStorage: solo un resumen pequeño, o copia completa si IndexedDB falló
    try {
      localStorage.setItem('aurora_resumen', JSON.stringify({ id: e.id, nombre: e.nombre, actualizado: e.actualizado }));
      if (!ok) { localStorage.setItem('aurora_estado_respaldo', JSON.stringify(e)); ok = true; }
      else localStorage.removeItem('aurora_estado_respaldo');
    } catch (err) { console.warn('localStorage:', err); }
    return ok;
  },

  async cargar(){
    if (this.disponible) {
      try { const r = await this._operacion('readonly', st => st.get(this.CLAVE)); if (r) return r; }
      catch (err) { console.error('IndexedDB:', err); }
    }
    try {
      const s = localStorage.getItem('aurora_estado_respaldo');
      if (s) return JSON.parse(s);
    } catch (err) { /* sin datos */ }
    return null;
  },

  async cargarPrueba(){
    if (this.disponible) {
      try { const r = await this._operacion('readonly', st => st.get(this.CLAVE_PRUEBA)); if (r) return r; }
      catch (err) { console.error('IndexedDB:', err); }
    }
    try { const s = localStorage.getItem('aurora_prueba_respaldo'); if (s) return JSON.parse(s); } catch (err) {}
    return null;
  }
};

/* =========================================================
   10. EXPORTACIÓN E IMPORTACIÓN (respaldo JSON)
   ========================================================= */
function descargarArchivo(nombreArchivo, contenido, tipo){
  const blob = new Blob([contenido], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

async function exportarJSON(){
  if (!estado) return;
  agregarHistorial('respaldo', 'Descargó un respaldo de su aventura.');
  estado.actualizado = ahoraISO();
  const paquete = Object.assign({}, estado, {
    exportado: { fecha: ahoraISO(), appVersion: APP.version, tipo: 'respaldo-recuperable' }
  });
  const texto = JSON.stringify(paquete);
  const mb = new Blob([texto]).size / 1048576;
  if (mb > APP.limiteAvisoMB) {
    await dialogo({
      titulo: 'Archivo grande',
      mensaje: `Tu respaldo pesa aproximadamente ${mb.toFixed(1)} MB. Se descargará igual, pero puede tardar y ocupar espacio. Si vas a enviarlo, usa una conexión estable.`,
      botones: [{ texto: 'Descargar de todos modos', valor: true, clase: 'btn-primario' }]
    });
  }
  const nombreArchivo = `${estado.perfilPrueba ? 'PRUEBA-DOCENTE' : 'aventura-aurora'}_${slug(estado.nombre)}_${sello()}.json`;
  descargarArchivo(nombreArchivo, texto, 'application/json');
  await guardarAhora();
  toast('📥 Respaldo descargado. ¡Guárdalo bien!');
}

function validarRespaldo(obj){
  if (!obj || typeof obj !== 'object' || Array.isArray(obj))
    return { ok: false, error: 'El archivo no contiene una aventura válida.' };
  if (obj.app !== APP.id)
    return { ok: false, error: 'Este archivo no pertenece a «La última misión de Aurora».' };
  if (typeof obj.nombre !== 'string' || !limpiarNombre(obj.nombre))
    return { ok: false, error: 'El archivo no tiene el nombre de la estudiante.' };
  if (!obj.fases || typeof obj.fases !== 'object' || Array.isArray(obj.fases))
    return { ok: false, error: 'El archivo está incompleto: faltan las fases de la aventura.' };
  if (typeof obj.version === 'number' && obj.version > APP.version)
    return { ok: false, error: 'Este respaldo fue creado con una versión más nueva de la aplicación.' };
  return { ok: true };
}

function leerArchivoTexto(archivo){
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(String(lector.result || ''));
    lector.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    lector.readAsText(archivo);
  });
}

async function importarJSON(archivo){
  if (!archivo) return;
  try {
    if (archivo.size > APP.limiteImportarMB * 1048576)
      throw new Error('El archivo es demasiado grande para ser un respaldo de la aventura.');
    const texto = await leerArchivoTexto(archivo);
    let obj;
    try { obj = JSON.parse(texto); }
    catch (e) { throw new Error('El archivo está dañado o no es un respaldo .json de la aventura.'); }
    const v = validarRespaldo(obj);
    if (!v.ok) throw new Error(v.error);
    if (obj.perfilPrueba === true && !CONFIG_DOCENTE.MODO_PRUEBA_DOCENTE)
      throw new Error('Este archivo pertenece al perfil de prueba del docente y no puede usarse en la aventura.');

    delete obj.exportado;
    const recuperado = normalizarEstado(obj);

    // Si en el teléfono hay OTRA aventura con avance, pedir confirmación
    const actual = (estado && !estado.perfilPrueba) ? estado : estadoGuardado;   // El perfil de prueba no cuenta
    if (!recuperado.perfilPrueba && actual && actual.id !== recuperado.id && tieneProgreso(actual)) {
      const r = await dialogo({
        titulo: 'Reemplazar aventura',
        html: `<p>En este teléfono hay una aventura de <strong>${esc(actual.nombre)}</strong>.</p>
               <p>Si recuperas la de <strong>${esc(recuperado.nombre)}</strong>, la anterior se reemplazará aquí. Te recomendamos descargar primero su respaldo.</p>`,
        botones: [
          { texto: `Descargar respaldo de ${primerNombre(actual.nombre)}`, valor: 'respaldo', clase: 'btn-secundario' },
          { texto: 'Recuperar de todos modos', valor: 'si', clase: 'btn-primario' },
          { texto: 'Cancelar', valor: 'no', clase: 'btn-texto' }
        ]
      });
      if (r === 'respaldo') { estado = actual; await exportarJSON(); return; }
      if (r !== 'si') return;
    }

    estado = recuperado;
    agregarHistorial('recuperacion', `Recuperó su aventura desde el archivo «${archivo.name}».`);
    await guardarAhora();
    mostrarMenu();
    toast(`📂 ¡Aventura recuperada, ${primerNombre(estado.nombre)}!`);
  } catch (err) {
    await dialogo({ titulo: 'No se pudo recuperar', mensaje: err.message || 'Ocurrió un problema al leer el archivo.' });
  }
}

/* =========================================================
   11. FOTOGRAFÍAS (utilidad para la fase 6, «Cacería de evidencias»)
   Comprime a JPEG y devuelve Base64 (dataURL).
   ========================================================= */
async function comprimirImagen(archivo, { maxLado = 1280, calidad = 0.72 } = {}){
  if (!archivo || !/^image\//.test(archivo.type || ''))
    throw new Error('El archivo seleccionado no es una imagen.');
  const url = URL.createObjectURL(archivo);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('No se pudo abrir la imagen. Prueba con otra fotografía.'));
      i.src = url;
    });
    const escala = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * escala));
    const h = Math.max(1, Math.round(img.naturalHeight * escala));
    const lienzo = document.createElement('canvas');
    lienzo.width = w; lienzo.height = h;
    const ctx = lienzo.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const dataURL = lienzo.toDataURL('image/jpeg', calidad);
    return { dataURL, ancho: w, alto: h, bytes: Math.round(dataURL.length * 0.75) };
  } finally {
    URL.revokeObjectURL(url);
  }
}

function validarNombre(nombre){
  if (!nombre) return 'Escribe tu nombre completo para comenzar.';
  if (!/^[\p{L}\s'.-]+$/u.test(nombre)) return 'Usa solo letras en tu nombre (sin números ni símbolos).';
  const partes = nombre.split(' ').filter(p => p.replace(/[.'-]/g, '').length >= 2);
  if (partes.length < 2) return 'Escribe tu nombre y al menos un apellido.';
  return '';
}

async function comenzarAventura(){
  const nombre = limpiarNombre($('#inputNombre').value);

            { texto: 'Comenzar desde cero', valor: 'nueva', clase: 'btn-secundario' },

        : [ { texto: `Descargar respaldo de ${primerNombre(previo.nombre)}`, valor: 'respaldo', clase: 'btn-secundario' },

    });
    if (r === 'continuar') { estado = previo; agregarHistorial('regreso', 'Regresó a su aventura.'); guardarAuto(); mostrarMenu(); return; }
