      v.api.responder('paginasVistas', Math.max(Number(v.api.respuestas.paginasVistas) || 0, nueva + 1));
      v.api.guardar();
    }
    this.pintar(paso > 0 ? 'desde-derecha' : 'desde-izquierda');
    try { v.cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
  },
  completar(boton){
    const v = this.vista; if (!v || v.finalizando || v.pagina !== v.total - 1) return;
    v.finalizando = true; boton.disabled = true;
    const api = v.api, fe = api.estadoFase, it = intentoAbierto(fe);
    v.cont.querySelector('.lr-sobre').classList.add('brilla');
    api.registrarEvento('Completó el recorrido de recuerdos');
    api.completar({
      paginasRecorridas: v.total,
      estaciones: v.paginas.map(p => ({ estacion: p.titulo, conDatos: !p.html.includes('lr-vacio') && !p.html.includes('lr-prueba') })),
      fotografiasEnAlbum: (v.paginas.find(p => p.id === 'evidencias') || {}).fotos ? v.paginas.find(p => p.id === 'evidencias').fotos.length : 0,
      intentos: fe.intentos.length,
      fechaInicio: fe.fechaInicio,
      fechaFinalizacion: ahoraISO()
    }, { mensaje: `¡Qué bonito recorrido, ${primerNombre(api.nombre)}! Gracias por revivir cada recuerdo conmigo.` });
  },

  /* ---------- Ampliar fotografías (visor a pantalla completa) ---------- */
  abrirFoto(i){
    const v = this.vista; if (!v) return;
    const fotos = (v.paginas.find(p => p.id === 'evidencias') || {}).fotos || [];
    if (!fotos.length) return;
    this.cerrarFoto();
    const visor = document.createElement('div');
    visor.className = 'lr-visor';
    visor.setAttribute('role', 'dialog'); visor.setAttribute('aria-modal', 'true');
    const mostrar = k => {
      const ev = fotos[k];
      visor.dataset.k = k;
      visor.innerHTML = `
        <button type="button" class="lr-cerrar" aria-label="Cerrar">✕</button>
        <figure><img src="${ev.imagen}" alt="${esc(ev.reto || 'Fotografía')}">
          <figcaption><strong>${ev.reto === RETO_FINAL_ALBUM ? '💌 ' : ''}${esc(ev.reto || `Reto ${k + 1}`)}</strong>${ev.mensajeAurora ? `<span>${esc(ev.mensajeAurora)}</span>` : ''}<small>${k + 1} de ${fotos.length}</small></figcaption></figure>
        <div class="lr-visor-nav">
          <button type="button" data-v="-1" ${k === 0 ? 'disabled' : ''} aria-label="Fotografía anterior">‹</button>
          <button type="button" data-v="1" ${k === fotos.length - 1 ? 'disabled' : ''} aria-label="Fotografía siguiente">›</button>
        </div>`;
      visor.querySelector('.lr-cerrar').addEventListener('click', () => this.cerrarFoto());
      visor.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => mostrar(Math.min(Math.max(0, k + +b.dataset.v), fotos.length - 1))));
    };
    visor.addEventListener('click', e => { if (e.target === visor) this.cerrarFoto(); });
    this.teclaVisor = e => {
      if (e.key === 'Escape') this.cerrarFoto();
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const k = +visor.dataset.k + (e.key === 'ArrowRight' ? 1 : -1);
        if (k >= 0 && k < fotos.length) mostrar(k);
      }
    };
    document.addEventListener('keydown', this.teclaVisor);
    mostrar(i);
    document.body.appendChild(visor);
    this.visor = visor;
  },
  cerrarFoto(){
    if (this.visor) { this.visor.remove(); this.visor = null; }
    if (this.teclaVisor) { document.removeEventListener('keydown', this.teclaVisor); this.teclaVisor = null; }
  }
};

/* =========================================================
   14.2 MOTOR · FASE 8: «Felicitación y despedida»
   - Al llegar (con las 7 misiones anteriores completadas) se registra
     la finalización de la misión 8 ANTES de generar el recuerdo.
   - «Guardar mi recuerdo de Aurora» descarga un álbum HTML autónomo con:
     · Portada, mensaje de Aurora, las ocho misiones, aprendizajes,
       álbum fotográfico (todas las fotos reales, ampliables) y la sección

     · Copia íntegra del estado guardado en
       <script type="application/json" id="registro-docente">.
       (Está oculta a la vista, pero NO cifrada.)
     · Consulta docente: abrir el archivo agregando #docente al final
       de la dirección. No hay botones docentes en la vista normal.
   ========================================================= */
const MENSAJE_DESPEDIDA = [

  'Hoy no solamente has terminado una aventura conmigo. Hoy celebramos algo mucho más importante: ¡has culminado tu primer año de formación como futura maestra de preprimaria!',

  'Quiero que te sientas orgullosa de todo lo que has conseguido. Todavía tienes mucho por aprender, nuevas experiencias por vivir y retos por superar, pero cada paso te está acercando a la maestra que sueñas ser.',

  'Con mucho cariño y admiración,',
  'Aurora'
];
const LINEAS_FIRMA = 2;   // Las dos últimas líneas son la firma
const esFirma = i => i >= MENSAJE_DESPEDIDA.length - LINEAS_FIRMA;

function blobADataURL(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}
/* JSON seguro para incrustar en HTML: < > & y separadores de línea Unicode
   se escriben como secuencias \uXXXX (sigue siendo JSON válido). */
function jsonParaHTML(obj){
  return JSON.stringify(obj)
    .replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026')
    .replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
}
function nombreArchivoRecuerdo(e){
  const base = String(e.nombre || 'Estudiante').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'Estudiante';
  return `${e.perfilPrueba ? 'PRUEBA_' : ''}Recuerdo_Aurora_${base}.html`;
}

/* Script de la consulta docente que viaja DENTRO del recuerdo descargado.
   Solo usa textContent/createElement: el contenido de las estudiantes nunca
   se interpreta como HTML. Se activa con #docente en la dirección. */
function scriptConsultaDocente(){
  var nodo = document.getElementById('registro-docente');
  var datos = null;
  try { datos = JSON.parse(nodo.textContent); } catch (e) { datos = null; }
  var seccion = document.getElementById('consulta-docente');
  var recuerdo = document.getElementById('recuerdo');
  var construido = false;
  function el(tag, texto, clase){ var x = document.createElement(tag); if (texto != null) x.textContent = String(texto); if (clase) x.className = clase; return x; }
  function fecha(iso){ try { return iso ? new Date(iso).toLocaleString('es-GT') : '—'; } catch (e) { return String(iso); } }
  function sinImagenes(v){
    if (typeof v === 'string' && v.indexOf('data:image/') === 0) return '[imagen incrustada · ' + Math.round(v.length * 0.75 / 1024) + ' KB]';
    if (Array.isArray(v)) return v.map(sinImagenes);
    if (v && typeof v === 'object') { var o = {}; Object.keys(v).forEach(function (k) { o[k] = sinImagenes(v[k]); }); return o; }
    return v;
  }
  function bloque(titulo, valor){
    var d = el('details'); d.appendChild(el('summary', titulo));
    d.appendChild(el('pre', JSON.stringify(sinImagenes(valor), null, 2)));
    return d;
  }
  function descargar(){
    var texto = JSON.stringify(datos, null, 2);
    var url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url;
    a.download = 'registro_' + ((datos.estado && datos.estado.nombre) || 'estudiante').replace(/[^A-Za-z0-9]+/g, '_') + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
  }
  function construir(){

/* Visor de fotografías que viaja DENTRO del álbum descargado (sin dependencias).
   Copia la imagen ya incorporada; el contenido se inserta con textContent. */
function scriptAlbum(){
  var album = Array.prototype.slice.call(document.querySelectorAll('[data-ampliar]'));
  var fotos = album, capa = null, actual = 0;
  function cerrar(){ if (capa) { capa.remove(); capa = null; document.removeEventListener('keydown', tecla); } }
  function tecla(e){
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowRight') mostrar(actual + 1);
    else if (e.key === 'ArrowLeft') mostrar(actual - 1);
  }
  function boton(texto, etiqueta, fn, desactivado){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = texto; b.setAttribute('aria-label', etiqueta);
    b.disabled = !!desactivado; b.onclick = fn; return b;
  }
  function mostrar(i){
    if (i < 0 || i >= fotos.length) return;
    actual = i;
    var f = fotos[i], img = f.querySelector('img');
    if (!capa) {
      capa = document.createElement('div'); capa.className = 'visor'; capa.setAttribute('role', 'dialog'); capa.setAttribute('aria-modal', 'true');
      capa.addEventListener('click', function (e) { if (e.target === capa) cerrar(); });
      document.body.appendChild(capa); document.addEventListener('keydown', tecla);
    }
    capa.textContent = '';
    var x = boton('✕', 'Cerrar', cerrar); x.className = 'cerrar'; capa.appendChild(x);
    var g = document.createElement('img'); g.src = img.src; g.alt = img.alt; capa.appendChild(g);
    var t = document.createElement('p'); t.className = 'titulo'; t.textContent = f.getAttribute('data-titulo') || ''; capa.appendChild(t);
    var nav = document.createElement('div'); nav.className = 'nav';
    nav.appendChild(boton('‹', 'Fotografía anterior', function () { mostrar(actual - 1); }, i === 0));
    var c = document.createElement('span'); c.textContent = (i + 1) + ' de ' + fotos.length; nav.appendChild(c);
    nav.appendChild(boton('›', 'Fotografía siguiente', function () { mostrar(actual + 1); }, i === fotos.length - 1));
    capa.appendChild(nav);
  }
  function enlazar(lista){
    lista.forEach(function (f, i) {
      var abrir = function () { fotos = lista; mostrar(i); };
      f.addEventListener('click', abrir);
      f.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
    });
  }
  enlazar(album);
  enlazar(Array.prototype.slice.call(document.querySelectorAll('[data-ampliar-solo]')));   // Foto especial: se abre sola
}

    @media print{nav.indice,#consulta-docente,.visor{display:none}section.pagina{break-inside:avoid;box-shadow:none}}
    /* Consulta docente (#docente) */
    #consulta-docente{max-width:1000px;margin:0 auto;padding:20px 16px;font-size:.92rem}#consulta-docente table{border-collapse:collapse;width:100%;margin:8px 0 14px;background:#fff}

    #consulta-docente .nota{background:#fff3c4;border-radius:8px;padding:8px 10px;text-align:left;color:#33283f}
    .fotos-docente{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.fotos-docente figure{margin:0}.fotos-docente img{width:100%}
    #consulta-docente .pista{margin:4px 0;color:#5f526d}`;
  const html = `<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<main id="recuerdo">

  <header class="portada" id="portada">

    <h1>Mi aventura con Aurora</h1>
    <p class="nombre">${esc(e.nombre)}</p>
    <p>${esc(APP.curso)}</p>
    <p>${esc(APP.programa)}</p>
    ${e.fechaFinalizacion ? `<p class="fecha">Aventura completada el ${esc(fechaDia(e.fechaFinalizacion))}</p>` : ''}
    ${e.perfilPrueba ? `<p class="fecha">🧪 Álbum generado desde el perfil de prueba docente</p>` : ''}
  </header>

  <section class="pagina" id="mensaje">

    <div class="carta"><span class="sello" aria-hidden="true">💌</span>
      ${MENSAJE_DESPEDIDA.map((p, i) => `<p class="${esFirma(i) ? 'firma' : ''}${i === 0 ? ' inicio' : ''}">${esc(p.replace('{n}', n))}</p>`).join('')}

const Despedida = {
  vista: null,
  async montar(cont, api){
    const btnR = document.getElementById('btnReiniciar'); if (btnR) btnR.hidden = true;   // No aplica a la despedida
    const fe = api.estadoFase;
    this.vista = { cont, api };
    if (fe.estado !== 'completada' || intentoAbierto(fe)) {
      // La octava misión se registra al llegar a esta pantalla
      api.registrarEvento('Llegó a la despedida de Aurora');
      await api.completar({ mensajeMostrado: true, misionesCompletadas: FASES.length, fechaFinalizacion: ahoraISO() }, { permanecer: true });
    }
    if (this.vista && this.vista.cont === cont) this.pintar();
  },
  pintar(){
    const v = this.vista, nombre = estado.nombre, n = primerNombre(nombre);
    const k = indiceMisionActual();
    v.cont.innerHTML = `
      <div class="tarjeta desp">
        <div class="desp-confeti" aria-hidden="true">${['🎉','✨','🎓','💜','⭐','🎊','✨','🌸'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}</div>
        ${imgAurora('grande')}
        <h2 class="desp-nombre">${esc(nombre)}</h2>
        <p class="desp-contador">🎓 ${k} de ${FASES.length} misiones completadas</p>
        <div class="desp-carta">
          <span class="desp-sello" aria-hidden="true">🎓</span>
          ${MENSAJE_DESPEDIDA.map((p, i) => `<p class="${esFirma(i) ? 'firma' : ''}${i === 0 ? ' inicio' : ''}">${i === 0 ? `¡<strong>${esc(n)}</strong>, lo lograste!` : esc(p)}</p>`).join('')}
        </div>
      </div>
      <div class="tarjeta tarea-final" id="tareaFinal">
        <h2>📤 Tu última tarea: entregar tu recuerdo</h2>
        <p>¡Ya terminaste tu aventura! Ahora descarga tu álbum digital de recuerdos. Este archivo contiene tus fotografías, tus experiencias, tus respuestas y los logros que construiste durante nuestras misiones.</p>
        <p class="tarea-clave"><strong>El archivo HTML que descargues es el que debes subir como tarea a la plataforma de tu curso.</strong></p>
        <p>No entregues solamente una captura de pantalla. Debes adjuntar el archivo completo para que tu docente pueda revisar tu trabajo y las evidencias registradas.</p>
        <button type="button" id="btnRecuerdo" class="btn btn-primario btn-mision">📥 Descargar mi álbum para entregar</button>
        <p class="tarea-celular">📱 Después de descargarlo, busca el archivo en la carpeta <strong>Descargas</strong> de tu dispositivo y adjúntalo en la tarea correspondiente.</p>
        <p class="ayuda" id="despEstado" aria-live="polite"></p>
      </div>`;
    v.cont.querySelector('#btnRecuerdo').addEventListener('click', e => this.descargar(e.currentTarget));
  },
  async descargar(boton){
    const v = this.vista; if (!v) return;
    boton.disabled = true;
    const estadoTxt = v.cont.querySelector('#despEstado');
    estadoTxt.textContent = 'Preparando tu álbum…';
    try {
      const archivo = nombreArchivoRecuerdo(estado);
      // Registrar la descarga ANTES de copiar el estado, para que quede en el registro
      const previas = Array.isArray(v.api.respuestas.descargasRecuerdo) ? v.api.respuestas.descargasRecuerdo.slice() : [];
      previas.push({ fecha: ahoraISO(), archivo });
      v.api.responder('descargasRecuerdo', previas);
      agregarHistorial('recuerdo', `Descargó su recuerdo de Aurora (${archivo}).`, 'despedida');
      await guardarAhora();
      const html = await generarRecuerdoHTML();
      const mb = new Blob([html]).size / 1048576;
      if (mb > APP.limiteAvisoMB) {
        await dialogo({ titulo: 'Archivo grande', mensaje: `Tu recuerdo pesa aproximadamente ${mb.toFixed(1)} MB porque incluye tus fotografías. Se descargará igual; usa una conexión estable si vas a enviarlo.`,
                        botones: [{ texto: 'Descargar', valor: true, clase: 'btn-primario' }] });
      }
      descargarArchivo(archivo, html, 'text/html');
      estadoTxt.textContent = `✅ Se descargó «${archivo}». Ahora súbelo a la tarea de tu curso: la aplicación no lo entrega por ti. Puedes volver a descargarlo cuando quieras.`;
      toast('📥 ¡Tu álbum se descargó! Recuerda subirlo a la tarea.');
    } catch (err) {
      console.error(err);
      estadoTxt.textContent = 'No se pudo generar el álbum. Intenta de nuevo.';
    } finally { boton.disabled = false; }
  }
};

registrarMotor('despedida', {
  iniciar(contenedor, api){ Despedida.montar(contenedor, api); },
  reiniciar(contenedor, api){ Despedida.montar(contenedor, api); }
});

registrarMotor('recorrido', {
  iniciar(contenedor, api){ LibroRecuerdos.montar(contenedor, api, false); },
  reiniciar(contenedor, api){ LibroRecuerdos.montar(contenedor, api, true); }
});

window.addEventListener('popstate', () => { if (pantallaActual === 'fase' && estado) mostrarMenu(); });

// Guardar al salir o al cambiar de aplicación
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarAhora(); });
window.addEventListener('pagehide', () => { guardarAhora(); });

async function iniciarApp(){
  await Persistencia.abrir();
  try {
    const guardado = await Persistencia.cargar();
    if (guardado && validarRespaldo(guardado).ok) estadoGuardado = normalizarEstado(guardado);
  } catch (err) { console.error(err); }
  try { history.replaceState(null, ''); } catch (e) {}
  mostrarBienvenida();
}
iniciarApp();
