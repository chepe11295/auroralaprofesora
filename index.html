    cont.innerHTML = `
      <div class="tarjeta">
        ${globoAurora(`<p>¡Hola de nuevo, <strong>${n}</strong>! Has demostrado que tienes buena memoria, pero ahora necesitamos descubrir algunas palabras misteriosas. Te daré pistas para que completes un crucigrama con conceptos que hemos aprendido durante nuestras clases. ¡No te preocupes si alguna palabra se te dificulta, estaré aquí para ayudarte!</p>`)}
        <button type="button" id="btnCruComenzar" class="btn btn-primario btn-mision">¡Descubrir el crucigrama!</button>
      </div>`;
    cont.querySelector('#btnCruComenzar').addEventListener('click', () => {
      api.registrarEvento('Escuchó la presentación de Aurora');
      this.iniciarRespuestas(api);
      this.mostrarJuego(cont, api);
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },

  /* ---------- Construcción de la vista ---------- */
  prepararVista(cont, api, soloLectura){
    const cw = this.layout(api);
    const v = { cont, api, cw, soloLectura, mapa: new Map(), celdasPalabra: [], numeros: {}, el: {},
                activa: null, dir: 'H', marcas: {}, finalizando: false };
    cw.palabras.forEach((w, i) => {
      const ks = [];
      for (let k = 0; k < w.respuesta.length; k++) {
        const key = GeneradorCrucigrama.clave(w.dir === 'V' ? w.fila + k : w.fila, w.dir === 'H' ? w.col + k : w.col);
        ks.push(key);
        if (!v.mapa.has(key)) v.mapa.set(key, []);
        v.mapa.get(key).push(i);
      }
      v.celdasPalabra.push(ks);
      v.numeros[ks[0]] = w.numero;
    });
    return v;
  },
  htmlCuadricula(v){
    let html = '';
    for (let f = 0; f < v.cw.filas; f++) for (let c = 0; c < v.cw.columnas; c++) {
      const k = GeneradorCrucigrama.clave(f, c);
      html += v.mapa.has(k)
        ? `<div class="cru-celda" data-k="${k}">${v.numeros[k] ? `<span class="cru-n">${v.numeros[k]}</span>` : ''}<span class="cru-l"></span></div>`
        : `<div class="cru-vacia" aria-hidden="true"></div>`;
    }
    return `<div class="cru-grid" id="cruGrid" style="--cols:${v.cw.columnas}" role="grid" aria-label="Crucigrama">${html}</div>`;
  },
  htmlListas(v, conRespuestas){
    const item = (w, i) => `<li data-p="${i}"><strong>${w.numero}.</strong> ${conRespuestas ? `<strong>${esc(this.datos(w.respuesta).respuesta)}</strong> — ` : ''}${esc(w.pista || this.datos(w.respuesta).pista)}</li>`;
    const h = v.cw.palabras.map((w, i) => w.dir === 'H' ? item(w, i) : '').join('');
    const vv = v.cw.palabras.map((w, i) => w.dir === 'V' ? item(w, i) : '').join('');
    return `<h3>➡️ Horizontales</h3><ol class="cru-lista" id="cruListaH">${h}</ol><h3>⬇️ Verticales</h3><ol class="cru-lista" id="cruListaV">${vv}</ol>`;
  },

  mostrarJuego(cont, api){
    const v = this.prepararVista(cont, api, false);
    const r = api.respuestas;
    const modo = r.preferencias && r.preferencias.teclado === 'celular' ? 'celular' : 'app';
    v.modo = modo;
    (Array.isArray(r.palabrasResueltas) ? r.palabrasResueltas : []).forEach(id => {
      const i = v.cw.palabras.findIndex(w => this.idPalabra(w) === id);
      if (i >= 0) v.marcas[i] = 'correcta';
    });
    const filas = this.TECLAS.map((fila, n) => `<div class="cru-fila">${fila.split('').map(L => `<button type="button" class="cru-tecla" data-l="${L}">${L}</button>`).join('')}${n === 2 ? `<button type="button" class="cru-tecla ancha" data-accion="borrar" aria-label="Borrar letra">⌫</button>` : ''}</div>`).join('');
    cont.innerHTML = `
      <div class="cru-pista" id="cruPista" aria-live="polite"><span class="cru-ref" id="cruRef"></span><p id="cruTexto"></p></div>
      <div class="tarjeta cru-panel">
        <p class="sopa-contador" id="cruContador"></p>
        <div class="cru-marco" id="cruMarco">
          ${this.htmlCuadricula(v)}
          <input type="text" id="cruEntrada" class="cru-entrada" value="_" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" aria-label="Escribir letra">
        </div>
        <p class="cru-mensaje" id="cruMensaje" aria-live="polite"></p>
        <div class="cru-acciones">
          <button type="button" class="btn btn-secundario" id="cruDir">⇄ Cambiar dirección</button>
          <button type="button" class="btn btn-secundario" id="cruBorrar">⌫ Borrar</button>
        </div>
        <div class="cru-teclado" id="cruTeclado"${modo === 'celular' ? ' hidden' : ''}>${filas}</div>
        <button type="button" class="btn btn-texto" id="cruModo"></button>
        <button type="button" class="btn btn-primario" id="cruComprobar">✔️ Comprobar mis palabras</button>
        ${CONFIG_DOCENTE.PERMITIR_PISTAS ? `<button type="button" class="btn btn-suave" id="cruAyuda">💡 Necesito una pista</button>` : ''}
      </div>
      <div class="tarjeta">${this.htmlListas(v, false)}</div>
      <div id="cruFinal"></div>
      ${api.estadoFase.estado === 'completada' ? `<details class="tarjeta"><summary>📖 Ver tu crucigrama resuelto</summary>${this.htmlResuelto(api)}</details>` : ''}`;

    cont.querySelectorAll('.cru-celda').forEach(el => { v.el[el.dataset.k] = el; });
    v.grid = cont.querySelector('#cruGrid');
    v.entrada = cont.querySelector('#cruEntrada');
    this.vista = v;

    // Selección inicial: primera palabra sin resolver
    const pend = v.cw.palabras.findIndex((w, i) => !this.palabraCorrecta(i)) ;
    this.seleccionarPalabra(pend >= 0 ? pend : 0, false);
    this.enlazar(v);
    this.ajustarTam();
    this.pintar();
    if (this.todasCorrectas()) this.finalizar();
  },

  /* ---------- Estado de letras ---------- */
  letras(){ const r = this.vista.api.respuestas; return r.letras && typeof r.letras === 'object' ? r.letras : {}; },
  reveladas(){ const r = this.vista.api.respuestas; return new Set(Array.isArray(r.reveladas) ? r.reveladas : []); },
  correcta(k){
    const v = this.vista, i = v.mapa.get(k)[0], w = v.cw.palabras[i];
    return w.respuesta[v.celdasPalabra[i].indexOf(k)];
  },
  palabraCorrecta(i){
    const L = this.letras(), w = this.vista.cw.palabras[i];
    return this.vista.celdasPalabra[i].every((k, n) => L[k] === w.respuesta[n]);
  },
  palabraCompleta(i){ const L = this.letras(); return this.vista.celdasPalabra[i].every(k => !!L[k]); },
  todasCorrectas(){ return this.vista.cw.palabras.every((w, i) => this.palabraCorrecta(i)); },
  resueltas(){ const r = this.vista.api.respuestas; return Array.isArray(r.palabrasResueltas) ? r.palabrasResueltas.slice() : []; },

  /* ---------- Selección ---------- */
  palabraActiva(){
    const v = this.vista; if (!v.activa) return -1;
    return (v.mapa.get(v.activa) || []).find(i => v.cw.palabras[i].dir === v.dir) ?? -1;
  },
  seleccionarPalabra(i, pintar = true){
    const v = this.vista, rev = this.reveladas(), L = this.letras();
    const ks = v.celdasPalabra[i];
    v.dir = v.cw.palabras[i].dir;
    v.activa = ks.find(k => !L[k] && !rev.has(k)) || ks.find(k => !rev.has(k)) || ks[0];
    if (pintar) this.pintar();
  },
  tocarCelda(k){
    const v = this.activa(); if (!v || v.finalizando) return;
    const ws = v.mapa.get(k); if (!ws) return;
    if (k === v.activa && ws.length > 1) v.dir = v.dir === 'H' ? 'V' : 'H';
    else if (!ws.some(i => v.cw.palabras[i].dir === v.dir)) v.dir = v.cw.palabras[ws[0]].dir;
    v.activa = k;
    this.pintar();
    if (v.modo === 'celular') this.enfocarEntrada();
  },
  cambiarDireccion(){
    const v = this.activa(); if (!v || !v.activa) return;
    if ((v.mapa.get(v.activa) || []).length > 1) { v.dir = v.dir === 'H' ? 'V' : 'H'; this.pintar(); }
    else toast('Esta casilla pertenece a una sola palabra');
    if (v.modo === 'celular') this.enfocarEntrada();
  },
  mover(df, dc){
    const v = this.activa(); if (!v || !v.activa) return;
    let [f, c] = v.activa.split(',').map(Number);
    for (let paso = 0; paso < Math.max(v.cw.filas, v.cw.columnas); paso++) {
      f += df; c += dc;
      if (f < 0 || c < 0 || f >= v.cw.filas || c >= v.cw.columnas) return;
      const k = GeneradorCrucigrama.clave(f, c);
      if (v.mapa.has(k)) {
        const dir = dc !== 0 ? 'H' : 'V';
        v.activa = k;
        if (v.mapa.get(k).some(i => v.cw.palabras[i].dir === dir)) v.dir = dir;
        else v.dir = v.cw.palabras[v.mapa.get(k)[0]].dir;
        this.pintar(); return;
      }
    }
  },

  /* ---------- Escritura ---------- */
  escribir(letra){
    const v = this.activa(); if (!v || v.finalizando || !v.activa) return;
    letra = String(letra).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    if (!/^[A-ZÑ]$/.test(letra)) return;
    const rev = this.reveladas();
    const i = this.palabraActiva();
    if (!rev.has(v.activa)) {
      const L = Object.assign({}, this.letras());
      L[v.activa] = letra;
      v.api.responder('letras', L);
      this.olvidarMarcas([v.activa]);
    }
    // Avanzar a la siguiente casilla de la palabra (saltando letras reveladas)
    if (i >= 0) {
      const ks = v.celdasPalabra[i];
      let n = ks.indexOf(v.activa) + 1;
      while (n < ks.length && rev.has(ks[n])) n++;
      if (n < ks.length) v.activa = ks[n];
    }
    this.pintar();
    this.revisarFin();
  },
  borrar(){
    const v = this.activa(); if (!v || v.finalizando || !v.activa) return;
    const rev = this.reveladas(), L = Object.assign({}, this.letras());
    let k = v.activa;
    if (!L[k] || rev.has(k)) {
      const i = this.palabraActiva();
      if (i >= 0) {
        const ks = v.celdasPalabra[i];
        let n = ks.indexOf(k) - 1;
        while (n >= 0 && rev.has(ks[n])) n--;
        if (n >= 0) k = ks[n];
      }
    }
    v.activa = k;
    if (L[k] && !rev.has(k)) {
      delete L[k];
      v.api.responder('letras', L);
      this.olvidarMarcas([k]);
    }
    this.pintar();
  },
  olvidarMarcas(claves){
    const v = this.vista;
    const afectadas = new Set();
    claves.forEach(k => (v.mapa.get(k) || []).forEach(i => afectadas.add(i)));
    let res = this.resueltas();
    afectadas.forEach(i => { delete v.marcas[i]; res = res.filter(id => id !== this.idPalabra(v.cw.palabras[i])); });
    v.api.responder('palabrasResueltas', res);
  },

  /* ---------- Comprobación ---------- */
  comprobar(){
    const v = this.activa(); if (!v || v.finalizando) return;
    const api = v.api;
    api.responder('comprobaciones', (Number(api.respuestas.comprobaciones) || 0) + 1);
    let correctas = 0, revisar = 0, completas = 0;
    const res = [];
    v.cw.palabras.forEach((w, i) => {
      if (!this.palabraCompleta(i)) { delete v.marcas[i]; return; }
      completas++;
      if (this.palabraCorrecta(i)) { v.marcas[i] = 'correcta'; correctas++; res.push(this.idPalabra(w)); }
      else { v.marcas[i] = 'revisar'; revisar++; }
    });
    api.responder('palabrasResueltas', res);
    api.registrarEvento('Comprobó sus palabras', { correctas, revisar, completas });
    api.guardar();
    let texto;
    if (!completas) texto = 'Completa al menos una palabra y vuelve a comprobar. ¡Tú puedes!';
    else if (revisar) texto = '¡Vas muy bien! Algunas palabras necesitan una segunda mirada.';
    else if (correctas < v.cw.palabras.length) texto = '¡Excelente! Tus palabras completas están correctas. Sigue con las que faltan.';
    else texto = '¡Todas tus palabras están correctas!';
    this.mensaje(texto);
    this.pintar();
    this.revisarFin();
  },
  mensaje(texto){
    const v = this.vista; if (!v) return;
    const el = v.cont.querySelector('#cruMensaje');
    el.textContent = texto;
    clearTimeout(v.tMensaje);
    v.tMensaje = setTimeout(() => { if (el.textContent === texto) el.textContent = ''; }, 6000);
  },

  /* ---------- Ayudas prácticas ---------- */
  async pedirAyuda(){
    const v = this.activa(); if (!v || v.finalizando) return;
    if (!CONFIG_DOCENTE.PERMITIR_PISTAS) return;
    let i = this.palabraActiva();
    if (i < 0 || this.palabraCorrecta(i)) {
      const pend = v.cw.palabras.findIndex((w, n) => !this.palabraCorrecta(n));
      if (pend < 0) return;
      if (i >= 0) toast('🎉 Esa palabra ya está resuelta. Te llevo a una pendiente.');
      this.seleccionarPalabra(pend);
      i = pend;
    }
    const w = v.cw.palabras[i], L = this.letras();
    const primeraOk = L[v.celdasPalabra[i][0]] === w.respuesta[0];
    const botones = [{ texto: '🔤 Descubrir una letra', valor: 'letra', clase: 'btn-primario' }];
    if (!primeraOk) botones.push({ texto: '1️⃣ Mostrar la primera letra', valor: 'primera', clase: 'btn-secundario' });
    botones.push({ texto: '✨ Descubrir la palabra completa', valor: 'palabra', clase: 'btn-secundario' });
    botones.push({ texto: 'Seguir intentando', valor: null, clase: 'btn-texto' });
    const elegido = await dialogo({
      titulo: '💡 ¿Cómo te ayudo?',
      html: globoAurora(`<p>Estás trabajando en la palabra <strong>${w.numero} ${this.textoDir(w).toLowerCase()}</strong>: «${esc(w.pista || this.datos(w.respuesta).pista)}».</p><p>Elige la ayuda que prefieras. ¡Pedir ayuda también es aprender!</p>`),
      botones
    });
    if (!elegido || this.vista !== v) return;
    this.aplicarAyuda(i, elegido, true);
  },
  aplicarAyuda(i, tipo, registrar){
    const v = this.vista, api = v.api, w = v.cw.palabras[i];
    const L = Object.assign({}, this.letras()), rev = this.reveladas();
    const pendientes = v.celdasPalabra[i].filter(k => L[k] !== this.correcta(k));
    if (!pendientes.length) return null;
    let elegidas;
    if (tipo === 'palabra') elegidas = pendientes;
    else if (tipo === 'primera' && pendientes.includes(v.celdasPalabra[i][0])) elegidas = [v.celdasPalabra[i][0]];
    else { tipo = 'letra'; elegidas = [pendientes[Azar.entero(pendientes.length)]]; }
    elegidas.forEach(k => { L[k] = this.correcta(k); rev.add(k); });
    api.responder('letras', L);
    api.responder('reveladas', [...rev]);
    this.olvidarMarcas(elegidas);
    if (tipo === 'palabra' || this.palabraCorrecta(i)) {
      v.marcas[i] = 'correcta';
      const res = this.resueltas(); if (!res.includes(this.idPalabra(w))) res.push(this.idPalabra(w));
      api.responder('palabrasResueltas', res);
    }
    const nombres = { letra: 'Descubrir una letra', primera: 'Mostrar la primera letra', palabra: 'Descubrir la palabra completa' };
    const ayudas = Array.isArray(api.respuestas.ayudas) ? api.respuestas.ayudas.slice() : [];
    ayudas.push({ tipo, palabra: w.respuesta, numero: w.numero, dir: w.dir, celdas: elegidas.length, fecha: ahoraISO() });
    api.responder('ayudas', ayudas);
    const texto = `${nombres[tipo]} en la palabra ${w.numero} ${this.textoDir(w).toLowerCase()}`;
    if (registrar) api.registrarPista(texto);
    api.registrarEvento(`Ayuda: ${texto}`, { palabra: w.respuesta, celdas: elegidas });
    api.guardar();
    // Ubicar la escritura en la siguiente casilla libre
    const libre = v.celdasPalabra[i].find(k => !rev.has(k) && L[k] !== this.correcta(k));
    v.dir = w.dir; v.activa = libre || elegidas[elegidas.length - 1];
    this.pintar();
    elegidas.forEach(k => { const el = v.el[k]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); });
    this.mensaje(tipo === 'palabra' ? '✨ ¡Palabra descubierta!' : '✨ ¡Letra descubierta!');
    this.revisarFin();
    return texto;
  },

  /* ---------- Dibujo ---------- */
  pintar(){
    const v = this.vista; if (!v) return;
    const L = this.letras(), rev = this.reveladas();
    const i = this.palabraActiva();
    const enPalabra = new Set(i >= 0 ? v.celdasPalabra[i] : []);
    const estadoCelda = {};
    Object.keys(v.marcas).forEach(n => v.celdasPalabra[n].forEach(k => {
      if (estadoCelda[k] !== 'revisar') estadoCelda[k] = v.marcas[n];
    }));
    Object.entries(v.el).forEach(([k, el]) => {
      el.querySelector('.cru-l').textContent = L[k] || '';
      el.classList.toggle('en-palabra', enPalabra.has(k));
      el.classList.toggle('activa', k === v.activa);
      el.classList.toggle('revelada', rev.has(k));
      el.classList.toggle('correcta', estadoCelda[k] === 'correcta');
      el.classList.toggle('revisar', estadoCelda[k] === 'revisar');
    });
    const total = v.cw.palabras.length;
    const res = this.resueltas();
    v.cont.querySelector('#cruContador').textContent = `Palabras resueltas: ${res.length} de ${total}`;
    if (i >= 0) {
      const w = v.cw.palabras[i];
      v.cont.querySelector('#cruRef').textContent = `${w.numero} · ${this.textoDir(w)} · ${w.respuesta.length} letras`;
      v.cont.querySelector('#cruTexto').textContent = w.pista || this.datos(w.respuesta).pista;
    }
    v.cont.querySelectorAll('.cru-lista li').forEach(li => {
      const n = +li.dataset.p;
      li.classList.toggle('activa', n === i);
      li.classList.toggle('resuelta', res.includes(this.idPalabra(v.cw.palabras[n])));
    });
    v.cont.querySelector('#cruDir').disabled = !(v.activa && (v.mapa.get(v.activa) || []).length > 1);
    v.cont.querySelector('#cruModo').textContent = v.modo === 'app' ? '📱 Prefiero usar el teclado de mi celular' : '⌨️ Usar el teclado de letras de Aurora';
    // Llevar la entrada oculta junto a la casilla activa (el teclado del celular no la tapa)
    const el = v.el[v.activa];
    if (el && v.entrada) { v.entrada.style.left = el.offsetLeft + 'px'; v.entrada.style.top = el.offsetTop + 'px'; }
  },
  ajustarTam(){
    const v = this.vista; if (!v || !v.grid) return;
    const marco = v.cont.querySelector('#cruMarco');
    const disponible = marco.clientWidth - 8 - (v.cw.columnas - 1) * 2;
    const tam = Math.max(24, Math.min(46, Math.floor(disponible / v.cw.columnas)));
    v.grid.style.setProperty('--tam', tam + 'px');
  },
  enfocarEntrada(){
    const v = this.vista; if (!v || !v.entrada) return;
    try { v.entrada.focus({ preventScroll: false }); v.entrada.setSelectionRange(1, 1); } catch (e) {}
  },

  /* ---------- Eventos ---------- */
  enlazar(v){
    v.grid.addEventListener('click', e => {
      const el = e.target.closest('.cru-celda');
      if (el) this.tocarCelda(el.dataset.k);
    });
    v.cont.querySelectorAll('.cru-lista li').forEach(li => li.addEventListener('click', () => {
      if (v.finalizando) return;
      this.seleccionarPalabra(+li.dataset.p);
      try { v.cont.querySelector('#cruPista').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
      if (v.modo === 'celular') this.enfocarEntrada();
    }));
    v.cont.querySelector('#cruTeclado').addEventListener('click', e => {
      const t = e.target.closest('.cru-tecla'); if (!t) return;
      if (t.dataset.accion === 'borrar') this.borrar(); else this.escribir(t.dataset.l);
    });
    v.cont.querySelector('#cruDir').addEventListener('click', () => this.cambiarDireccion());
    v.cont.querySelector('#cruBorrar').addEventListener('click', () => { this.borrar(); if (v.modo === 'celular') this.enfocarEntrada(); });
    v.cont.querySelector('#cruComprobar').addEventListener('click', () => this.comprobar());
    const ayuda = v.cont.querySelector('#cruAyuda');
    if (ayuda) ayuda.addEventListener('click', () => this.pedirAyuda());
    v.cont.querySelector('#cruModo').addEventListener('click', () => {
      v.modo = v.modo === 'app' ? 'celular' : 'app';
      v.api.responder('preferencias', { teclado: v.modo });
      v.cont.querySelector('#cruTeclado').hidden = v.modo === 'celular';
      this.pintar();
      if (v.modo === 'celular') this.enfocarEntrada(); else v.entrada.blur();
    });

    // Teclado del celular (entrada oculta). Se mantiene un carácter "_" para
    // detectar el borrado aun en teclados Android que no envían Backspace.
    const inp = v.entrada;
    inp.addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Backspace') { e.preventDefault(); this.borrar(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.mover(0, -1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); this.mover(0, 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.mover(-1, 0); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); this.mover(1, 0); }
      else if (e.key.length === 1 && /\p{L}/u.test(e.key)) { e.preventDefault(); this.escribir(e.key); }
    });
    inp.addEventListener('input', e => {
      const val = inp.value;
      if ((e.inputType && e.inputType.indexOf('delete') === 0) || !val.length) this.borrar();
      else {
        const nuevas = val.replace(/_/g, '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-ZÑ]/g, '');
        if (nuevas) this.escribir(nuevas[nuevas.length - 1]);
      }
      inp.value = '_';
      try { inp.setSelectionRange(1, 1); } catch (err) {}
    });
  },
  registrarEventosGlobales(){
    if (this.eventosGlobales) return;
    this.eventosGlobales = true;
    // Teclado físico en computadoras (sin depender de él en celulares)
    document.addEventListener('keydown', e => {
      const v = this.activa();
      if (!v || v.finalizando || !$('#modal').hidden) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target && e.target.matches && e.target.matches('input, textarea, select')) return;
      if (e.key === 'Backspace') { e.preventDefault(); this.borrar(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.mover(0, -1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); this.mover(0, 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.mover(-1, 0); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); this.mover(1, 0); }
      else if (e.key.length === 1 && /\p{L}/u.test(e.key)) { e.preventDefault(); this.escribir(e.key); }
    });
    window.addEventListener('resize', () => { if (this.activa()) this.ajustarTam(); });
  },

  /* ---------- Finalización automática ---------- */
  revisarFin(){ if (this.todasCorrectas()) this.finalizar(); },
  finalizar(){
    const v = this.vista;
    if (!v || v.finalizando) return;
    v.finalizando = true;
    const api = v.api, fe = api.estadoFase, r = api.respuestas, it = intentoAbierto(fe);
    try { v.entrada.blur(); } catch (e) {}
    v.cw.palabras.forEach((w, i) => { v.marcas[i] = 'correcta'; });
    api.responder('palabrasResueltas', v.cw.palabras.map(w => this.idPalabra(w)));
    this.pintar();
    v.grid.classList.add('celebrar');
    const texto = `¡Misterio resuelto, ${primerNombre(api.nombre)}! Completaste el crucigrama y descubriste todas las palabras. Lo importante no es hacerlo todo sin ayuda, sino seguir intentando hasta encontrar una solución. ¡Vamos a descubrir qué otra aventura nos espera!`;
    v.cont.querySelector('#cruFinal').innerHTML = `<div class="tarjeta mem-celebracion"><span class="confeti" aria-hidden="true">🎉🧩✨🧩🎉</span>${globoAurora(`<p>${esc(texto)}</p>`)}</div>`;
    const ayudas = Array.isArray(r.ayudas) ? r.ayudas : [];
    const conAyuda = [...new Set(ayudas.map(a => a.palabra))];
    const resultado = {
      palabras: v.cw.palabras.map(w => ({ numero: w.numero, direccion: this.textoDir(w), respuesta: w.respuesta, pista: w.pista || this.datos(w.respuesta).pista,
                                          resueltaConAyuda: conAyuda.includes(w.respuesta) })),
      totalPalabras: v.cw.palabras.length,
      comprobaciones: Number(r.comprobaciones) || 0,
      ayudasUtilizadas: ayudas.map(a => ({ tipo: a.tipo, palabra: a.palabra, letras: a.celdas })),
      letrasReveladas: Array.isArray(r.reveladas) ? r.reveladas.length : 0,
      palabrasDescubiertasCompletas: ayudas.filter(a => a.tipo === 'palabra').map(a => a.palabra),
      intentos: fe.intentos.length,
      pistasIntento: it ? it.pistas : 0,
      pistasTotales: fe.pistas.length,
      origenCrucigrama: api.asignacion.origen || 'generado',
      fechaInicio: fe.fechaInicio,
      fechaFinalizacion: ahoraISO()
    };
    api.registrarEvento('Completó todas las palabras del crucigrama');
    this.despues(1600, () => api.completar(resultado, { mensaje: texto }));
  },

  /* ---------- Interfaz de pistas del sistema general ---------- */
  pistaDisponible(api){
    const v = this.activa();
    if (!v) return 'Primero presiona «¡Descubrir el crucigrama!».';
    if (v.finalizando) return '¡Ya completaste el crucigrama!';
    return true;
  },
  pista(api){
    const v = this.activa(); if (!v) return null;
    let i = this.palabraActiva();
    if (i < 0 || this.palabraCorrecta(i)) i = v.cw.palabras.findIndex((w, n) => !this.palabraCorrecta(n));
    if (i < 0) return null;
    return this.aplicarAyuda(i, 'letra', false);   // El sistema general registra la pista
  },

  /* ---------- Consulta de la misión completada ---------- */
  htmlResuelto(api){
    const v = this.prepararVista(null, api, true);
    let html = '';
    for (let f = 0; f < v.cw.filas; f++) for (let c = 0; c < v.cw.columnas; c++) {
      const k = GeneradorCrucigrama.clave(f, c);
      if (!v.mapa.has(k)) { html += `<div class="cru-vacia"></div>`; continue; }
      const i = v.mapa.get(k)[0], w = v.cw.palabras[i];
      html += `<div class="cru-celda correcta">${v.numeros[k] ? `<span class="cru-n">${v.numeros[k]}</span>` : ''}<span class="cru-l">${w.respuesta[v.celdasPalabra[i].indexOf(k)]}</span></div>`;
    }
    return `<div class="cru-marco"><div class="cru-grid" style="--cols:${v.cw.columnas};--tam:28px">${html}</div></div>
            <div style="margin-top:12px">${this.htmlListas(v, true)}</div>`;
  },
  mostrarConsulta(cont, api){
    const total = this.layout(api).palabras.length;
    cont.innerHTML = `
      <div class="tarjeta">
        <p class="sopa-contador">✅ Palabras resueltas: ${total} de ${total}</p>
        ${this.htmlResuelto(api)}
      </div>
      <p class="ayuda" style="text-align:center;margin-bottom:12px">Si quieres, puedes usar «Jugar de nuevo»: tu resultado original se conserva.</p>`;
    // Ajustar el tamaño de la cuadrícula de consulta al ancho disponible
    const grid = cont.querySelector('.cru-grid'), marco = cont.querySelector('.cru-marco');
    const cols = this.layout(api).columnas;
    grid.style.setProperty('--tam', Math.max(24, Math.min(40, Math.floor((marco.clientWidth - 8 - (cols - 1) * 2) / cols))) + 'px');
  }
};

registrarMotor('crucigrama', {
  asignar(azar){ return Cruci.crear(azar); },
  iniciar(contenedor, api){ Cruci.montar(contenedor, api, false); },
  reiniciar(contenedor, api){ Cruci.montar(contenedor, api, true); },
  pista(api){ return Cruci.pista(api); },
  pistaDisponible(api){ return Cruci.pistaDisponible(api); }
});

/* =========================================================
   13.4 MOTOR · FASE 4: «Cacería de evidencias» (retos fotográficos)
   - asignar(): 5 de los 15 retos, UNA sola vez
     (estado.fases.evidencias.asignacion.retos).
   - Las fotos se comprimen (comprimirImagen) y se guardan como
     evidencias en estado.evidencias (IndexedDB + respaldo JSON),
     con: imagen Base64, reto, número, intento y mensaje de Aurora.
   - Datos del intento (api.respuestas):
       retos {idReto: {evidencia, fecha}}, estadoIdeas {idReto: n}
   - Reiniciar elimina SOLO las fotos del intento que se cierra;
     nunca las de una misión ya completada ni las de otras misiones.
   ========================================================= */
const Evidencias = {
  CANTIDAD: 5,
  AVISO: 'Antes de tomar fotografías con otras personas, pide su permiso. Evita fotografiar a niños o niñas y respeta los espacios donde no esté permitido tomar imágenes.',
  ALTERNATIVA: 'Si no puedes fotografiar a otra persona, represéntalo con objetos, un dibujo o una fotografía tuya.',
  vista: null,
  timers: [],

  /* ---------- Datos ---------- */
  datos(id){ return BANCO_RETOS.evidencias.find(x => x.id === id) || null; },
  asignados(api){
    const a = api.asignacion;
    return (a && Array.isArray(a.retos) ? a.retos : []).filter(id => this.datos(id));
  },
  registro(api){ const r = api.respuestas.retos; return r && typeof r === 'object' ? r : {}; },
  evidencia(id){ return id ? estado.evidencias.find(ev => ev.id === id && ev.fase === 'evidencias') || null : null; },
  fotoDe(api, idReto){
    const reg = this.registro(api)[idReto];
    const ev = reg && this.evidencia(reg.evidencia);
    return ev && fotoValida(ev) ? ev : null;
  },
  completados(api, ids){ return ids.filter(id => this.fotoDe(api, id)); },

  /* ---------- Temporizadores seguros ---------- */
  limpiar(){ this.timers.forEach(t => clearTimeout(t)); this.timers = []; this.vista = null; },
  despues(ms, fn){
    const v = this.vista;
    const t = setTimeout(() => {
      this.timers = this.timers.filter(x => x !== t);
      if (v && this.vista === v && v.cont.isConnected) fn(v);
    }, ms);
    this.timers.push(t);
  },

  /* ---------- Entrada del motor ---------- */
  montar(cont, api, esReinicio){
    this.limpiar();
    const ids = this.asignados(api);
    if (!ids.length) throw new Error('La asignación de retos no es válida.');
    const btnPista = document.getElementById('btnPista');
    if (btnPista) btnPista.hidden = true;            // Cada reto tiene su botón «Necesito una idea»
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return this.mostrarConsulta(cont, api, ids);
    if (!api.respuestas.iniciado) {
      const yaJugo = fe.intentos.some(i => i.respuestas && i.respuestas.iniciado);
      if (!esReinicio && !yaJugo) return this.mostrarIntro(cont, api, ids);
      this.iniciarRespuestas(api);
    }
    this.mostrarJuego(cont, api, ids);
  },
  iniciarRespuestas(api){
    api.responder('iniciado', true);
    api.responder('retos', {});
    api.responder('estadoIdeas', {});
    api.registrarEvento('Comenzó la cacería de evidencias');
    api.guardar();
  },
  borrarFotosDelIntentoCerrado(api){
    const fe = api.estadoFase;
    const cerrado = fe.intentos[fe.intentos.length - 2];          // El intento que acaba de cerrarse
    if (!cerrado || cerrado.estado !== 'reiniciado') return;
    const reg = (cerrado.respuestas && cerrado.respuestas.retos) || {};
    let n = 0;
    Object.values(reg).forEach(x => {
      const ev = x && this.evidencia(x.evidencia);
      if (ev && ev.intento === cerrado.numero && api.quitarEvidencia(ev.id)) n++;
    });
    if (n) api.registrarEvento(`Se eliminaron ${n} fotografías del intento reiniciado`);
  },

  mostrarIntro(cont, api, ids){
    const n = esc(primerNombre(api.nombre));
    cont.innerHTML = `
      <div class="tarjeta">
        ${globoAurora(`<p>¡<strong>${n}</strong>, llegó el momento de levantarte y vivir una aventura fuera de la pantalla! Esta vez necesitarás tu creatividad, tu cámara y muchas ganas de divertirte. Tendrás que completar algunos desafíos fotográficos que he preparado especialmente para ti. ¿Estás lista para convertirte en una cazadora de recuerdos?</p>`)}
        <div class="aviso" style="margin:4px 0 0">🔒 ${esc(this.AVISO)}</div>
        <button type="button" id="btnEvComenzar" class="btn btn-primario btn-mision">¡Comenzar la cacería!</button>
      </div>`;
    cont.querySelector('#btnEvComenzar').addEventListener('click', () => {
      api.registrarEvento('Escuchó la presentación de Aurora y leyó el aviso de privacidad');
      this.iniciarRespuestas(api);
      this.mostrarJuego(cont, api, ids);
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },

  /* ---------- Tarjetas de retos ---------- */
  mostrarJuego(cont, api, ids){
    cont.innerHTML = `
      <div class="aviso">🔒 ${esc(this.AVISO)}<br><small>Tus fotografías se guardan solo en este teléfono y en tu archivo de respaldo.</small></div>
      <div class="tarjeta"><p class="sopa-contador" id="evContador"></p><div class="barra"><span id="evBarra"></span></div></div>
      <div id="evRetos">${ids.map(id => `<article class="tarjeta ev-reto" data-id="${id}"></article>`).join('')}</div>
      <div id="evFinal"></div>
      <input type="file" id="evArchivo" accept="image/*" hidden>
      ${api.estadoFase.estado === 'completada' ? `<details class="tarjeta"><summary>📖 Ver tu cacería completada</summary>${this.htmlGaleria(api, ids)}</details>` : ''}`;
    const v = { cont, api, ids, previas: {}, cargando: {}, objetivo: null, finalizando: false };
    this.vista = v;
    ids.forEach(id => this.pintarReto(id));
    this.actualizarContador();

    const archivo = cont.querySelector('#evArchivo');
    archivo.addEventListener('change', () => {
      const f = archivo.files && archivo.files[0];
      const id = v.objetivo;
      archivo.value = '';
      if (f && id) this.prepararFoto(id, f);
    });
    cont.querySelector('#evRetos').addEventListener('click', e => {
      const b = e.target.closest('button[data-accion]'); if (!b || v.finalizando) return;
      const id = b.closest('.ev-reto').dataset.id;
      const accion = b.dataset.accion;
      if (accion === 'elegir') { v.objetivo = id; archivo.value = ''; archivo.click(); }
      else if (accion === 'usar') this.confirmar(id);
      else if (accion === 'cancelar') { delete v.previas[id]; this.pintarReto(id); }
      else if (accion === 'idea') this.darIdea(id);
    });
    if (this.completados(api, ids).length >= ids.length) this.finalizar();
  },

  pintarReto(id){
    const v = this.vista; if (!v) return;
    const el = v.cont.querySelector(`.ev-reto[data-id="${id}"]`); if (!el) return;
    const d = this.datos(id), n = v.ids.indexOf(id) + 1;
    const ev = this.fotoDe(v.api, id), previa = v.previas[id], cargando = v.cargando[id];
    el.classList.toggle('ok', !!ev && !previa);
    let foto, botones;
    if (cargando) {
      foto = `<div class="ev-vacia"><span aria-hidden="true">⏳</span>Preparando tu fotografía…</div>`;
      botones = '';
    } else if (previa) {
      foto = `<img class="ev-previa" src="${previa.dataURL}" alt="Vista previa para el reto ${n}">`;
      botones = `<button type="button" class="btn btn-primario" data-accion="usar">✅ Usar esta fotografía</button>
                 <button type="button" class="btn btn-secundario" data-accion="elegir">🔁 Elegir otra</button>
                 <button type="button" class="btn btn-texto" data-accion="cancelar">Cancelar</button>`;
    } else if (ev) {
      foto = `<img src="${ev.imagen}" alt="Fotografía del reto ${n}: ${esc(d.titulo)}">`;
      botones = `<button type="button" class="btn btn-secundario" data-accion="elegir">🔄 Cambiar fotografía</button>`;
    } else {
      foto = `<div class="ev-vacia"><span aria-hidden="true">📷</span>Aquí aparecerá tu fotografía</div>`;
      botones = `<button type="button" class="btn btn-primario" data-accion="elegir">📷 Tomar o subir fotografía</button>
                 ${CONFIG_DOCENTE.PERMITIR_PISTAS ? `<button type="button" class="btn btn-suave" data-accion="idea">💡 Necesito una idea</button>` : ''}`;
    }
    el.innerHTML = `
      <div class="ev-cab"><span class="ev-num">${n}</span>
        <div><h3>${esc(d.titulo)}</h3><span class="ev-estado">${previa ? '👀 Revisa tu fotografía' : ev ? '✅ Reto completado' : '⏳ Pendiente'}</span></div></div>
      <p>${esc(d.instruccion)}</p>
      ${d.conOtras ? `<p class="ev-alt">🤝 ${esc(this.ALTERNATIVA)}</p>` : ''}
      <div class="ev-foto">${foto}</div>
      <div class="ev-botones">${botones}</div>`;
  },
  actualizarContador(){
    const v = this.vista; if (!v) return;
    const k = this.completados(v.api, v.ids).length;
    v.cont.querySelector('#evContador').textContent = `Retos completados: ${k} de ${v.ids.length}`;
    v.cont.querySelector('#evBarra').style.width = Math.round(k / v.ids.length * 100) + '%';
  },

  /* ---------- Fotografías ---------- */
  async prepararFoto(id, archivo){
    const v = this.vista; if (!v) return;
    v.cargando[id] = true; this.pintarReto(id);
    try {
      let r = await comprimirImagen(archivo, { maxLado: 1280, calidad: 0.72 });
      if (r.bytes > 700 * 1024) r = await comprimirImagen(archivo, { maxLado: 1024, calidad: 0.62 });  // Evitar archivos pesados
      if (this.vista !== v) return;
      v.previas[id] = r;
    } catch (err) {
      await dialogo({ titulo: 'No se pudo usar esa imagen', mensaje: (err && err.message ? err.message + ' ' : '') + 'Intenta con otra fotografía de tu galería o toma una nueva.' });
    } finally {
      if (this.vista === v) { delete v.cargando[id]; this.pintarReto(id); }
    }
  },
  confirmar(id){
    const v = this.vista; if (!v) return;
    const previa = v.previas[id]; if (!previa) return;
    const api = v.api, d = this.datos(id), it = intentoAbierto(api.estadoFase);
    const reg = Object.assign({}, this.registro(api));
    const anterior = reg[id] && reg[id].evidencia;
    const nuevoId = api.agregarEvidencia({
      imagen: previa.dataURL, ancho: previa.ancho, alto: previa.alto, bytes: previa.bytes,
      reto: d.titulo, retoId: id, numero: v.ids.indexOf(id) + 1, intento: it ? it.numero : null,
      mensajeAurora: d.mensajeAurora
    });
    if (anterior && anterior !== nuevoId) api.quitarEvidencia(anterior);       // Reemplazo
    reg[id] = { evidencia: nuevoId, fecha: ahoraISO() };
    api.responder('retos', reg);
    api.registrarEvento(`${anterior ? 'Cambió' : 'Agregó'} la fotografía del reto «${d.titulo}»`, { kb: Math.round(previa.bytes / 1024) });
    api.guardar();                                                             // Guardado inmediato
    delete v.previas[id];
    this.pintarReto(id);
    this.actualizarContador();
    const k = this.completados(api, v.ids).length;
    if (k >= v.ids.length) this.finalizar();
    else toast(`📸 ¡Reto completado! Llevas ${k} de ${v.ids.length}`);
  },

  /* ---------- Ideas prácticas (pistas) ---------- */
  textoIdea(api, id, avanzar){
    const d = this.datos(id);
    const st = Object.assign({}, api.respuestas.estadoIdeas || {});
    const n = Number(st[id]) || 0;
    const texto = d.ideas[n % d.ideas.length];
    if (avanzar) { st[id] = n + 1; api.responder('estadoIdeas', st); }
    return texto;
  },
  async darIdea(id){
    const v = this.vista; if (!v || !CONFIG_DOCENTE.PERMITIR_PISTAS) return;
    const d = this.datos(id);
    const texto = this.textoIdea(v.api, id, true);
    v.api.registrarPista(`Idea para «${d.titulo}»: ${texto}`);
    v.api.registrarEvento(`Pidió una idea para «${d.titulo}»`);
    await dialogo({ titulo: '💡 Una idea de Aurora', html: globoAurora(`<p>${esc(texto)}</p>`),
                    botones: [{ texto: '¡Gracias, Aurora!', valor: true, clase: 'btn-primario' }] });
  },
  pistaDisponible(api){
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return 'Ya completaste esta misión.';
    return this.vista ? true : 'Primero presiona «¡Comenzar la cacería!».';
  },
  pista(api){
    const v = this.vista; if (!v) return null;
    const pendiente = v.ids.find(id => !this.fotoDe(api, id));
    if (!pendiente) return null;
    return `Para «${this.datos(pendiente).titulo}»: ${this.textoIdea(api, pendiente, true)}`;
  },

  /* ---------- Finalización ---------- */
  finalizar(){
    const v = this.vista;
    if (!v || v.finalizando) return;
    v.finalizando = true;
    const api = v.api, fe = api.estadoFase, it = intentoAbierto(fe);
    const texto = `¡Cacería completada, ${primerNombre(api.nombre)}! Hoy no solamente cumpliste desafíos: también creaste recuerdos que forman parte de tu historia como futura maestra. Guarda esas sonrisas y esos momentos, porque volveremos a encontrarlos al final de nuestra aventura.`;
    const fotos = v.ids.map(id => this.fotoDe(api, id));
    v.cont.querySelector('#evFinal').innerHTML = `
      <div class="tarjeta mem-celebracion"><span class="confeti" aria-hidden="true">🎉📸✨📸🎉</span>
        <div class="ev-tira">${fotos.map((ev, i) => `<img src="${ev.imagen}" alt="Reto ${i + 1}">`).join('')}</div>
        ${globoAurora(`<p>${esc(texto)}</p>`)}</div>`;
    try { v.cont.querySelector('#evFinal').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    const resultado = {
      retos: v.ids.map((id, i) => {
        const d = this.datos(id), reg = this.registro(api)[id];
        return { numero: i + 1, retoId: id, titulo: d.titulo, instruccion: d.instruccion, evidencia: reg.evidencia, fecha: reg.fecha };
      }),
      fotografias: fotos.length,
      intentos: fe.intentos.length,
      pistasIntento: it ? it.pistas : 0,
      pistasTotales: fe.pistas.length,
      pistasUtilizadas: fe.pistas.map(p => p.texto),
      fechaInicio: fe.fechaInicio,
      fechaFinalizacion: ahoraISO()
    };
    api.registrarEvento('Completó los cinco retos fotográficos');
    this.despues(1500, () => api.completar(resultado, { mensaje: texto, boton: '🗺️ Volver al mapa y descubrir mi siguiente misión' }));
  },

  /* ---------- Consulta ---------- */
  htmlGaleria(api, ids){
    const fe = api.estadoFase, res = fe.resultado || {};
    const lista = Array.isArray(res.retos) ? res.retos : [];
    return `<div class="ev-galeria">${ids.map((id, i) => {
      const d = this.datos(id), item = lista.find(x => x.retoId === id);
      const ev = item && this.evidencia(item.evidencia);
      return `<div class="ev-item"><strong>${i + 1}. ${esc(d.titulo)}</strong>
        ${ev && fotoValida(ev) ? `<img src="${ev.imagen}" alt="Fotografía del reto ${esc(d.titulo)}">` : `<div class="ev-vacia"><span>📷</span>Fotografía no disponible</div>`}
        <p class="ev-alt">💬 ${esc(d.mensajeAurora)}</p></div>`;
    }).join('')}</div>`;
  },
  mostrarConsulta(cont, api, ids){
    cont.innerHTML = `
      <div class="tarjeta"><p class="sopa-contador">✅ Retos completados: ${ids.length} de ${ids.length}</p>
        <h3 style="margin-top:10px">📸 Tus recuerdos de la cacería</h3>${this.htmlGaleria(api, ids)}</div>
      <p class="ayuda" style="text-align:center;margin-bottom:12px">Si quieres, puedes usar «Jugar de nuevo»: tus fotografías originales se conservan.</p>`;
  },
  mensajeReinicio(api){
    return api.estadoFase.estado === 'completada'
      ? 'Comenzarás una nueva cacería con tus mismos cinco retos. Las fotografías de tu misión completada se conservan; solo se borrarán las que tomes en este nuevo intento si vuelves a reiniciar.'
      : 'La cacería volverá a empezar con tus mismos cinco retos. Se eliminarán las fotografías de este intento. Las fotografías y resultados de otras misiones no se tocan.';
  }
};

registrarMotor('evidencias', {
  asignar(azar, bancos){
    const banco = ((bancos && bancos.retos && bancos.retos.evidencias) || []).map(x => x.id);
    return { retos: azar.elegir(banco, Evidencias.CANTIDAD), fecha: ahoraISO() };
  },
  iniciar(contenedor, api){ Evidencias.montar(contenedor, api, false); },
  reiniciar(contenedor, api){ Evidencias.borrarFotosDelIntentoCerrado(api); Evidencias.montar(contenedor, api, true); },
  pista(api){ return Evidencias.pista(api); },
  pistaDisponible(api){ return Evidencias.pistaDisponible(api); },
  mensajeReinicio(api){ return Evidencias.mensajeReinicio(api); }
});

/* =========================================================
   14. RECORRIDO FINAL (fase 9: «El recorrido de nuestra aventura»)
   Construye los recuerdos SOLO con datos reales guardados:
   juegos completados, logros, fotografías, respuestas
   pedagógicas y momentos (reintentos, pistas, fechas).
   Si una categoría no tiene datos, ese recuerdo se omite.
   Pendiente: fase 8 (felicitación y «Descargar mi aventura
   completa» con informe HTML independiente).
   ========================================================= */
function fechaDia(iso){
  try { return new Date(iso).toLocaleDateString('es-GT', { day:'numeric', month:'long', year:'numeric' }); }
  catch (e) { return ''; }
}

/* Respuestas escritas de una fase: usa el último intento completado */
function respuestasDeFase(faseId){
  const fe = estado.fases[faseId];
  let origen = fe.respuestas || {};
  const ultimo = fe.intentos.slice().reverse().find(i => i.estado === 'completado');
  if (ultimo && ultimo.respuestas && Object.keys(ultimo.respuestas).length) origen = ultimo.respuestas;
  const lista = [];
  Object.keys(origen).forEach(clave => {
    const v = origen[clave];
    if (v && typeof v === 'object' && typeof v.respuesta === 'string' && v.respuesta.trim())
      lista.push({ pregunta: typeof v.pregunta === 'string' ? v.pregunta : '', respuesta: v.respuesta.trim(),
                  palabra: typeof v.palabraMostrada === 'string' ? v.palabraMostrada : '' });
    else if (typeof v === 'string' && v.trim().length >= 3)
      lista.push({ pregunta: '', respuesta: v.trim() });
  });
  return lista;
}

function fotoValida(ev){
  const src = ev && (ev.imagen || ev.dataURL);
  return typeof src === 'string' && /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(src) ? src : null;
}

function construirRecuerdos(){
  const n = esc(primerNombre(estado.nombre));
  const recuerdos = [];
  const hechas = FASES.filter(f => f.id !== 'recorrido' && f.id !== 'despedida' && faseCompletada(f.id));

  recuerdos.push({ emoji:'🎞️', titulo:`Nuestro recorrido, ${n}`,
    html:`<p>Antes de despedirnos, quiero que recordemos juntas todo lo que viviste en esta aventura.</p><p>Presiona «Siguiente recuerdo» para comenzar.</p>` });

  if (hechas.length) {
    recuerdos.push({ emoji:'🏆', titulo:'Los juegos que completaste',
      html:`<ul>${hechas.map(f => `<li>${f.emoji} <strong>${esc(f.titulo)}</strong></li>`).join('')}</ul>` });
    recuerdos.push({ emoji:'🌟', titulo:'Algunos de tus logros',
      html:`<ul>${hechas.map(f => `<li>${esc(f.logro)}</li>`).join('')}</ul>` });
  }

  const resEv = estado.fases.evidencias && estado.fases.evidencias.resultado;
  const fotosCaceria = resEv && Array.isArray(resEv.retos) ? new Set(resEv.retos.map(x => x.evidencia)) : null;
  const fotos = estado.evidencias.filter(ev => fotoValida(ev) && (ev.fase !== 'evidencias' || !fotosCaceria || fotosCaceria.has(ev.id)));
  fotos.forEach((ev, i) => {
    const titulo = ev.reto || ev.titulo || '';
    recuerdos.push({ emoji:'📸', titulo: fotos.length > 1 ? `Tu fotografía ${i + 1} de ${fotos.length}` : 'Tu fotografía',
      html:`${titulo ? `<p><strong>${esc(titulo)}</strong></p>` : ''}<img class="foto" src="${fotoValida(ev)}" alt="Evidencia fotográfica ${i + 1}">${ev.descripcion ? `<p>${esc(ev.descripcion)}</p>` : ''}${ev.mensajeAurora ? globoAurora(`<p>${esc(ev.mensajeAurora)}</p>`) : ''}` });
  });

  ['sopa', 'planificacion', 'ruta'].forEach(id => {
    if (!faseCompletada(id)) return;
    const lista = respuestasDeFase(id).slice(0, 3);
    if (!lista.length) return;
    const f = FASES.find(x => x.id === id);
    recuerdos.push({ emoji: f.emoji, titulo:`Tus palabras en «${esc(f.titulo)}»`,
      html: lista.map(r => `<div class="cita">${r.pregunta ? `<small>${esc(r.pregunta)}</small>` : ''}${r.palabra ? `<strong>${esc(r.palabra)}:</strong> ` : ''}${esc(r.respuesta)}</div>`).join('') });
  });

  const reintentos = FASES.reduce((s, f) => s + estado.fases[f.id].intentos.filter(i => i.estado === 'reiniciado').length, 0);
  const pistas = FASES.reduce((s, f) => s + estado.fases[f.id].pistas.length, 0);
  const momentos = [`El ${fechaDia(estado.fechaInicio)} comenzaste esta aventura con entusiasmo.`];
  if (reintentos) momentos.push(`Volviste a intentarlo ${reintentos} ${reintentos === 1 ? 'vez' : 'veces'}: las buenas maestras no se rinden.`);
  if (pistas) momentos.push(`Pediste ayuda ${pistas} ${pistas === 1 ? 'vez' : 'veces'} cuando lo necesitaste, y eso también es aprender.`);
  if (fotos.length) momentos.push(`Capturaste ${fotos.length} ${fotos.length === 1 ? 'evidencia' : 'evidencias'} de tu camino.`);
  if (hechas.length) momentos.push(`Superaste ${hechas.length} ${hechas.length === 1 ? 'misión' : 'misiones'} junto a Aurora.`);
  recuerdos.push({ emoji:'💞', titulo:'Momentos que compartimos', html:`<ul>${momentos.map(m => `<li>${m}</li>`).join('')}</ul>` });

  recuerdos.push({ aurora:true, titulo:'Un mensaje de Aurora',
    html:`<p><strong>${n}</strong>, recorriste cada misión con esfuerzo, creatividad y corazón de maestra.</p>
          <p>Cada juego, cada fotografía y cada reflexión muestran cuánto has crecido. Reconozco tu dedicación: estás construyendo la maestra que los niños y las niñas necesitan.</p>` });
  return recuerdos;
}

registrarMotor('recorrido', {
  iniciar(contenedor, api){
    const recuerdos = construirRecuerdos();
    let i = Math.min(Math.max(0, Number(api.respuestas.recuerdoActual) || 0), recuerdos.length - 1);
    api.responder('recuerdosPreparados', recuerdos.map(r => r.titulo.replace(/<[^>]+>/g, '')));

    const pintar = (desplazar) => {
      const r = recuerdos[i];
      const ultimo = i === recuerdos.length - 1;
      const yaCompletada = faseCompletada('recorrido');
      contenedor.innerHTML = `
        <div class="tarjeta recuerdo">
          <span class="contador-recuerdo">Recuerdo ${i + 1} de ${recuerdos.length}</span>
          ${r.aurora ? imgAurora('grande') : `<span class="emoji-recuerdo" aria-hidden="true">${r.emoji}</span>`}
          <h3>${r.titulo}</h3>
          ${r.html}
        </div>
        <div class="fila-botones">
          ${i > 0 ? `<button type="button" id="btnRecAnterior" class="btn btn-secundario">⬅️ Anterior</button>` : ''}
          ${!ultimo ? `<button type="button" id="btnRecSiguiente" class="btn btn-primario">Siguiente recuerdo ➡️</button>` : ''}
        </div>
        ${ultimo && !yaCompletada ? `<button type="button" id="btnRecFin" class="btn btn-primario">🎓 Terminar el recorrido</button>` : ''}`;
      const ir = (paso) => {
        i = Math.min(Math.max(0, i + paso), recuerdos.length - 1);
        api.responder('recuerdoActual', i);
        api.responder('recuerdosVistos', Math.max(Number(api.respuestas.recuerdosVistos) || 0, i + 1));
        pintar(true);
      };
      const ant = contenedor.querySelector('#btnRecAnterior');
      const sig = contenedor.querySelector('#btnRecSiguiente');
      const fin = contenedor.querySelector('#btnRecFin');
      if (ant) ant.addEventListener('click', () => ir(-1));
      if (sig) sig.addEventListener('click', () => ir(1));
      if (fin) fin.addEventListener('click', () => {
        fin.disabled = true;
        api.registrarEvento('Terminó el recorrido de recuerdos', { recuerdos: recuerdos.length });
        api.completar({ recuerdosVistos: recuerdos.length });
      });
      if (desplazar) { try { contenedor.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
    };
    pintar(false);
  },
  reiniciar(contenedor, api){
    api.responder('recuerdoActual', 0);
    this.iniciar(contenedor, api);
  }
});

async function iniciarApp(){

    if (guardado && validarRespaldo(guardado).ok) estadoGuardado = normalizarEstado(guardado);
  } catch (err) { console.error(err); }
  try { history.replaceState(null, ''); } catch (e) {}
  mostrarBienvenida();
}
iniciarApp();
