  evidencia(id){ return id ? estado.evidencias.find(ev => ev.id === id && ev.fase === 'evidencias') || null : null; },
  fotoDe(api, idReto){
    const reg = this.registro(api)[idReto];
    const ev = reg && this.evidencia(reg.evidencia);
    return ev && fotoValida(ev) ? ev : null;
  },
  completados(api, ids){ return ids.filter(id => this.fotoDe(api, id)); },

  /* ---------- Temporizadores seguros ---------- */
  limpiar(){ this.timers.forEach(t => clearTimeout(t)); this.timers = []; this.vista = null; },
  despues(ms, fn){
    const v = this.vista;
    const t = setTimeout(() => {
      this.timers = this.timers.filter(x => x !== t);
      if (v && this.vista === v && v.cont.isConnected) fn(v);
    }, ms);
    this.timers.push(t);
  },

  /* ---------- Entrada del motor ---------- */
  montar(cont, api, esReinicio){
    this.limpiar();
    this.ampliarAsignacion(api);
    const ids = this.asignados(api);
    if (!ids.length) throw new Error('La asignación de retos no es válida.');
    const btnPista = document.getElementById('btnPista');
    if (btnPista) btnPista.hidden = true;            // Cada reto tiene su botón «Necesito una idea»
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return this.mostrarConsulta(cont, api, ids);
    if (!api.respuestas.iniciado) {
      const yaJugo = fe.intentos.some(i => i.respuestas && i.respuestas.iniciado);
      if (!esReinicio && !yaJugo) return this.mostrarIntro(cont, api, ids);
      this.iniciarRespuestas(api);
    }
    this.mostrarJuego(cont, api, ids);
  },
  iniciarRespuestas(api){
    const fe = api.estadoFase, ids = this.asignados(api);
    const res = fe.resultado;
    // Misión completada con menos fotografías: se parte de las ya guardadas para añadir las restantes
    const ampliacion = fe.estado === 'completada' && res && Array.isArray(res.retos) && this.faltantesDelResultado(api, ids).length > 0;
    const retos = {};
    if (ampliacion) res.retos.forEach(r => { if (ids.includes(r.retoId) && this.evidencia(r.evidencia)) retos[r.retoId] = { evidencia: r.evidencia, fecha: r.fecha }; });
    api.responder('iniciado', true);
    api.responder('retos', retos);
    api.responder('estadoIdeas', {});
    if (ampliacion) api.responder('ampliacion', { desde: res.retos.length, hasta: ids.length });
    api.registrarEvento(ampliacion ? `Comenzó a añadir las fotografías restantes (${res.retos.length} de ${ids.length} ya guardadas)` : 'Comenzó la cacería de evidencias');
    api.guardar();
  },
  borrarFotosDelIntentoCerrado(api){
    const fe = api.estadoFase;
    const cerrado = fe.intentos[fe.intentos.length - 2];          // El intento que acaba de cerrarse
    if (!cerrado || cerrado.estado !== 'reiniciado') return;
    const reg = (cerrado.respuestas && cerrado.respuestas.retos) || {};
    let n = 0;
    Object.values(reg).forEach(x => {
      const ev = x && this.evidencia(x.evidencia);
      if (ev && ev.intento === cerrado.numero && api.quitarEvidencia(ev.id)) n++;
    });
    if (n) api.registrarEvento(`Se eliminaron ${n} fotografías del intento reiniciado`);
  },

  mostrarIntro(cont, api, ids){
    const n = esc(primerNombre(api.nombre));
    cont.innerHTML = `
      <div class="tarjeta">
        ${globoAurora(`<p>¡<strong>${n}</strong>, llegó el momento de levantarte y vivir una aventura fuera de la pantalla! Esta vez necesitarás tu creatividad, tu cámara y muchas ganas de divertirte. Tendrás que completar algunos desafíos fotográficos que he preparado especialmente para ti. ¿Estás lista para convertirte en una cazadora de recuerdos?</p>`)}
        <div class="aviso" style="margin:4px 0 0">🔒 ${esc(this.AVISO)}</div>
        <button type="button" id="btnEvComenzar" class="btn btn-primario btn-mision">¡Comenzar la cacería!</button>
      </div>`;
    cont.querySelector('#btnEvComenzar').addEventListener('click', () => {
      api.registrarEvento('Escuchó la presentación de Aurora y leyó el aviso de privacidad');
      this.iniciarRespuestas(api);
      this.mostrarJuego(cont, api, ids);
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },

  /* ---------- Tarjetas de retos ---------- */
  mostrarJuego(cont, api, ids){
    cont.innerHTML = `
      <div class="aviso">🔒 ${esc(this.AVISO)}<br><small>Tus fotografías se guardan solo en este teléfono y en tu archivo de respaldo.</small></div>
      <div class="tarjeta"><p class="sopa-contador" id="evContador"></p><div class="barra"><span id="evBarra"></span></div></div>
      <div id="evRetos">${ids.map(id => `<article class="tarjeta ev-reto" data-id="${id}"></article>`).join('')}</div>
      <div id="evFinal"></div>
      <input type="file" id="evArchivo" accept="image/*" hidden>
      ${api.estadoFase.estado === 'completada' ? `<details class="tarjeta"><summary>📖 Ver tu cacería completada</summary>${this.htmlGaleria(api, ids)}</details>` : ''}`;
    const v = { cont, api, ids, previas: {}, cargando: {}, objetivo: null, finalizando: false };
    this.vista = v;
    ids.forEach(id => this.pintarReto(id));
    this.actualizarContador();

    const archivo = cont.querySelector('#evArchivo');
    archivo.addEventListener('change', () => {
      const f = archivo.files && archivo.files[0];
      const id = v.objetivo;
      archivo.value = '';
      if (f && id) this.prepararFoto(id, f);
    });
    cont.querySelector('#evRetos').addEventListener('click', e => {
      const b = e.target.closest('button[data-accion]'); if (!b || v.finalizando) return;
      const id = b.closest('.ev-reto').dataset.id;
      const accion = b.dataset.accion;
      if (accion === 'elegir') { v.objetivo = id; archivo.value = ''; archivo.click(); }
      else if (accion === 'usar') this.confirmar(id);
      else if (accion === 'cancelar') { delete v.previas[id]; this.pintarReto(id); }
      else if (accion === 'idea') this.darIdea(id);
    });
    if (this.completados(api, ids).length >= ids.length) this.finalizar();
  },

  pintarReto(id){
    const v = this.vista; if (!v) return;
    const el = v.cont.querySelector(`.ev-reto[data-id="${id}"]`); if (!el) return;
    const d = this.datos(id), n = v.ids.indexOf(id) + 1;
    const ev = this.fotoDe(v.api, id), previa = v.previas[id], cargando = v.cargando[id];
    el.classList.toggle('ok', !!ev && !previa);
    let foto, botones;
    if (cargando) {
      foto = `<div class="ev-vacia"><span aria-hidden="true">⏳</span>Preparando tu fotografía…</div>`;
      botones = '';
    } else if (previa) {
      foto = `<img class="ev-previa" src="${previa.dataURL}" alt="Vista previa para el reto ${n}">`;
      botones = `<button type="button" class="btn btn-primario" data-accion="usar">${d.especial ? '💌 Guardar mi recuerdo para Aurora' : '✅ Usar esta fotografía'}</button>
                 <button type="button" class="btn btn-secundario" data-accion="elegir">🔁 Elegir otra</button>
                 <button type="button" class="btn btn-texto" data-accion="cancelar">Cancelar</button>`;
    } else if (ev) {
      foto = `<img src="${ev.imagen}" alt="Fotografía del reto ${n}: ${esc(d.titulo)}">`;
      botones = `<button type="button" class="btn btn-secundario" data-accion="elegir">🔄 Cambiar fotografía</button>`;
    } else {
      foto = `<div class="ev-vacia"><span aria-hidden="true">${d.especial ? '💌' : '📷'}</span>Aquí aparecerá tu fotografía</div>`;
      botones = `<button type="button" class="btn btn-primario" data-accion="elegir">${d.especial ? '📷 Tomar o elegir mi recuerdo' : '📷 Tomar o subir fotografía'}</button>
                 ${CONFIG_DOCENTE.PERMITIR_PISTAS ? `<button type="button" class="btn btn-suave" data-accion="idea">💡 Necesito una idea</button>` : ''}`;
    }
    el.classList.toggle('especial', !!d.especial);
    el.innerHTML = `
      <div class="ev-cab"><span class="ev-num">${n}</span>
        <div><h3>${d.especial ? '💌 ' : ''}${esc(d.titulo)}</h3><span class="ev-estado">${previa ? '👀 Revisa tu fotografía' : ev ? '✅ Reto completado' : '⏳ Pendiente'}</span></div></div>
      ${d.especial ? globoAurora(`<p>${esc(this.MENSAJE_ESPECIAL.replace('{n}', primerNombre(v.api.nombre)))}</p>`) : `<p>${esc(d.instruccion)}</p>`}
      ${d.conOtras ? `<p class="ev-alt">🤝 ${esc(this.ALTERNATIVA)}</p>` : ''}
      <div class="ev-foto">${foto}</div>
      <div class="ev-botones">${botones}</div>`;
  },
  actualizarContador(){
    const v = this.vista; if (!v) return;
    const k = this.completados(v.api, v.ids).length;
    v.cont.querySelector('#evContador').textContent = `Fotografías completadas: ${k} de ${v.ids.length}`;
    v.cont.querySelector('#evBarra').style.width = Math.round(k / v.ids.length * 100) + '%';
  },

  /* ---------- Fotografías ---------- */
  async prepararFoto(id, archivo){
    const v = this.vista; if (!v) return;
    v.cargando[id] = true; this.pintarReto(id);
    try {
      let r = await comprimirImagen(archivo, { maxLado: 1280, calidad: 0.72 });
      if (r.bytes > 700 * 1024) r = await comprimirImagen(archivo, { maxLado: 1024, calidad: 0.62 });  // Evitar archivos pesados
      if (this.vista !== v) return;
      v.previas[id] = r;
    } catch (err) {
      await dialogo({ titulo: 'No se pudo usar esa imagen', mensaje: (err && err.message ? err.message + ' ' : '') + 'Intenta con otra fotografía de tu galería o toma una nueva.' });
    } finally {
      if (this.vista === v) { delete v.cargando[id]; this.pintarReto(id); }
    }
  },
  confirmar(id){
    const v = this.vista; if (!v) return;
    const previa = v.previas[id]; if (!previa) return;
    const api = v.api, d = this.datos(id), it = intentoAbierto(api.estadoFase);
    const reg = Object.assign({}, this.registro(api));
    const anterior = reg[id] && reg[id].evidencia;
    const nuevoId = api.agregarEvidencia({
      imagen: previa.dataURL, ancho: previa.ancho, alto: previa.alto, bytes: previa.bytes,
      reto: d.titulo, retoId: id, numero: v.ids.indexOf(id) + 1, intento: it ? it.numero : null,
      mensajeAurora: d.mensajeAurora
    });
    if (anterior && anterior !== nuevoId) api.quitarEvidencia(anterior);       // Reemplazo
    reg[id] = { evidencia: nuevoId, fecha: ahoraISO() };
    api.responder('retos', reg);
    api.registrarEvento(`${anterior ? 'Cambió' : 'Agregó'} la fotografía del reto «${d.titulo}»`, { kb: Math.round(previa.bytes / 1024) });
    api.guardar();                                                             // Guardado inmediato
    delete v.previas[id];
    this.pintarReto(id);
    this.actualizarContador();
    const k = this.completados(api, v.ids).length;
    if (k >= v.ids.length) this.finalizar();
    else toast(d.especial ? '💌 ¡Tu recuerdo para Aurora quedó guardado!' : `📸 ¡Reto completado! Llevas ${k} de ${v.ids.length}`);
  },

  /* ---------- Ideas prácticas (pistas) ---------- */
  textoIdea(api, id, avanzar){
    const d = this.datos(id);
    const st = Object.assign({}, api.respuestas.estadoIdeas || {});
    const n = Number(st[id]) || 0;
    const texto = d.ideas[n % d.ideas.length];
    if (avanzar) { st[id] = n + 1; api.responder('estadoIdeas', st); }
    return texto;
  },
  async darIdea(id){
    const v = this.vista; if (!v || !CONFIG_DOCENTE.PERMITIR_PISTAS) return;
    const d = this.datos(id);
    const texto = this.textoIdea(v.api, id, true);
    v.api.registrarPista(`Idea para «${d.titulo}»: ${texto}`);
    v.api.registrarEvento(`Pidió una idea para «${d.titulo}»`);
    await dialogo({ titulo: '💡 Una idea de Aurora', html: globoAurora(`<p>${esc(texto)}</p>`),
                    botones: [{ texto: '¡Gracias, Aurora!', valor: true, clase: 'btn-primario' }] });
  },
  pistaDisponible(api){
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return 'Ya completaste esta misión.';
    return this.vista ? true : 'Primero presiona «¡Comenzar la cacería!».';
  },
  pista(api){
    const v = this.vista; if (!v) return null;
    const pendiente = v.ids.find(id => !this.fotoDe(api, id));
    if (!pendiente) return null;
    return `Para «${this.datos(pendiente).titulo}»: ${this.textoIdea(api, pendiente, true)}`;
  },

  /* ---------- Finalización ---------- */
  finalizar(){
    const v = this.vista;
    if (!v || v.finalizando) return;
    v.finalizando = true;
    const api = v.api, fe = api.estadoFase, it = intentoAbierto(fe);
    const texto = `¡Cacería completada, ${primerNombre(api.nombre)}! Hoy no solamente cumpliste desafíos: también creaste recuerdos que forman parte de tu historia como futura maestra. Guarda esas sonrisas y esos momentos, porque volveremos a encontrarlos al final de nuestra aventura.`;
    const fotos = v.ids.map(id => this.fotoDe(api, id));
    v.cont.querySelector('#evFinal').innerHTML = `
      <div class="tarjeta mem-celebracion"><span class="confeti" aria-hidden="true">🎉📸✨📸🎉</span>
        <div class="ev-tira">${fotos.map((ev, i) => `<img src="${ev.imagen}" alt="Reto ${i + 1}">`).join('')}</div>
        ${globoAurora(`<p>${esc(texto)}</p>`)}</div>`;
    try { v.cont.querySelector('#evFinal').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    const resultado = {
      retos: v.ids.map((id, i) => {
        const d = this.datos(id), reg = this.registro(api)[id];
        return { numero: i + 1, retoId: id, titulo: d.titulo, instruccion: d.instruccion, evidencia: reg.evidencia, fecha: reg.fecha };
      }),
      fotografias: fotos.length,
      intentos: fe.intentos.length,
      pistasIntento: it ? it.pistas : 0,
      pistasTotales: fe.pistas.length,
      pistasUtilizadas: fe.pistas.map(p => p.texto),
      fechaInicio: fe.fechaInicio,
      fechaFinalizacion: ahoraISO()
    };
    const ampliacion = !!api.respuestas.ampliacion && fe.estado === 'completada';
    api.registrarEvento(`Completó los ${fotos.length} retos fotográficos`);
    this.despues(1500, () => api.completar(resultado, { mensaje: texto, boton: '🗺️ Volver al mapa y descubrir mi siguiente misión', actualizarResultado: ampliacion }));
  },

  /* ---------- Consulta ---------- */
  htmlGaleria(api, ids){
    const fe = api.estadoFase, res = fe.resultado || {};
    const lista = Array.isArray(res.retos) ? res.retos : [];
    return `<div class="ev-galeria">${ids.map((id, i) => {
      const d = this.datos(id), item = lista.find(x => x.retoId === id);
      const ev = item && this.evidencia(item.evidencia);
      return `<div class="ev-item"><strong>${i + 1}. ${esc(d.titulo)}</strong>
        ${ev && fotoValida(ev) ? `<img src="${ev.imagen}" alt="Fotografía del reto ${esc(d.titulo)}">` : `<div class="ev-vacia"><span>📷</span>Fotografía no disponible</div>`}
        <p class="ev-alt">💬 ${esc(d.mensajeAurora)}</p></div>`;
    }).join('')}</div>`;
  },
  mostrarConsulta(cont, api, ids){
    const fe = api.estadoFase;
    const res = fe.resultado || {};
    const hechas = Array.isArray(res.retos) ? res.retos.length : 0;
    const faltan = fe.completadaEnPrueba ? [] : this.faltantesDelResultado(api, ids);
    cont.innerHTML = `
      ${faltan.length ? `
        <div class="tarjeta tarjeta-ampliar">
          ${globoAurora(`<p>¡Tu cacería creció, <strong>${esc(primerNombre(api.nombre))}</strong>! Ahora tiene ${ids.length} retos. Ya guardaste ${hechas} fotografías: puedes añadir las ${faltan.length} restantes, incluida «Un recuerdo para Aurora». Tu logro y tus misiones desbloqueadas se conservan.</p>`)}
          <button type="button" id="btnEvAmpliar" class="btn btn-primario">📸 Añadir mis fotografías restantes</button>
        </div>` : ''}
      <div class="tarjeta"><p class="sopa-contador">✅ Fotografías completadas: ${hechas} de ${ids.length}</p>
        <h3 style="margin-top:10px">📸 Tus recuerdos de la cacería</h3>${this.htmlGaleria(api, ids)}</div>
      <p class="ayuda" style="text-align:center;margin-bottom:12px">Si quieres, puedes usar «Jugar de nuevo»: tus fotografías originales se conservan.</p>`;
    const b = cont.querySelector('#btnEvAmpliar');
    if (b) b.addEventListener('click', () => {
      iniciarIntento(fe);                  // Nuevo intento que parte de las fotografías ya guardadas
      this.iniciarRespuestas(api);
      this.mostrarJuego(cont, api, ids);
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },
  mensajeReinicio(api){
    return api.estadoFase.estado === 'completada'
      ? 'Comenzarás una nueva cacería con tus mismos retos. Las fotografías de tu misión completada se conservan; solo se borrarán las que tomes en este nuevo intento si vuelves a reiniciar.'
      : 'La cacería volverá a empezar con tus mismos retos. Se eliminarán las fotografías de este intento. Las fotografías y resultados de otras misiones no se tocan.';
  }
};

registrarMotor('evidencias', {
  asignar(azar, bancos){
    const banco = (bancos && bancos.retos && bancos.retos.evidencias) || [];
    const fijo = banco.find(x => x.especial);
    const variables = azar.elegir(banco.filter(x => !x.especial).map(x => x.id), Evidencias.CANTIDAD - 1);
    return { retos: fijo ? variables.concat(fijo.id) : variables, fecha: ahoraISO() };
  },
  iniciar(contenedor, api){ Evidencias.montar(contenedor, api, false); },
  reiniciar(contenedor, api){ Evidencias.borrarFotosDelIntentoCerrado(api); Evidencias.montar(contenedor, api, true); },
  pista(api){ return Evidencias.pista(api); },
  pistaDisponible(api){ return Evidencias.pistaDisponible(api); },
  mensajeReinicio(api){ return Evidencias.mensajeReinicio(api); }
});

/* =========================================================
   13.5 MOTOR · FASE 4: «Defiende tu planificación general»
   - asignar(): 5 de las 12 situaciones y el orden mezclado de sus
     alternativas, UNA sola vez (estado.fases.planificacion.asignacion).
   - Datos del intento (api.respuestas):
       indice, decisiones {idSit: {intentos[{opcion, texto, adecuada,
       retroalimentacion, fecha}], resuelta}}, estadoPistas {idSit: n},
       borradorDefensa {texto}, defensa {pregunta, respuesta, fecha}
   - No se califica la defensa escrita: solo se guarda tal cual.
   ========================================================= */
/* =========================================================
   13.5a PREGUNTAS ABIERTAS (misiones 5 y 6)
   - Cada respuesta se guarda íntegra con su pregunta y su misión:
     {mision, numero, pregunta, respuesta, fecha}.
   - No se califican: solo se pide un mínimo para evitar respuestas
     vacías. La orientación de 50 a 120 palabras es una sugerencia.
   ========================================================= */
const PreguntasAbiertas = {
  MIN_PALABRAS: 8,
  palabras(t){ return (String(t || '').match(/[\p{L}\p{N}]+/gu) || []).length; },
  html(prefijo, preguntas, valores){
    return preguntas.map((p, i) => `
      <div class="pa-item">
        <label for="${prefijo}${i}"><span class="pa-num">${i + 1}</span><span>${esc(p)}</span></label>
        <textarea id="${prefijo}${i}" data-pa="${i}" rows="6" maxlength="4000" placeholder="Escribe con tus propias palabras…">${esc(valores[i] || '')}</textarea>
        <small class="pa-conteo" data-pa-conteo="${i}"></small>
      </div>`).join('');
  },
  textos(cont, n){ return Array.from({ length: n }, (_, i) => { const t = cont.querySelector(`[data-pa="${i}"]`); return t ? t.value : ''; }); },
  enlazar(cont, n, alCambiar){
    const refrescar = i => {
      const k = this.palabras(cont.querySelector(`[data-pa="${i}"]`).value);
      cont.querySelector(`[data-pa-conteo="${i}"]`).textContent = `${k} ${k === 1 ? 'palabra' : 'palabras'}`;
    };
    for (let i = 0; i < n; i++) {
      refrescar(i);
      cont.querySelector(`[data-pa="${i}"]`).addEventListener('input', () => { refrescar(i); alCambiar(this.textos(cont, n)); });
    }
  },
  primeraIncompleta(textos){ return textos.findIndex(t => this.palabras(t) < this.MIN_PALABRAS); },
  registro(mision, preguntas, textos){
    const fecha = ahoraISO();
    return preguntas.map((p, i) => ({ mision, numero: i + 1, pregunta: p, respuesta: String(textos[i] || '').trim(), fecha }));
  },
  lectura(registro){
    return (registro || []).map(r => `<div class="pa-leida"><strong>${r.numero}. ${esc(r.pregunta)}</strong><div class="cita">${esc(r.respuesta)}</div></div>`).join('');
  }
};

const Planificacion = {
  CANTIDAD: 10,
  MIN_CARACTERES: 30,
  MAX_CARACTERES: 700,
  PREGUNTA: 'De las estrategias que utilizaste en tus experiencias de aprendizaje durante el curso, ¿cuál consideras que te será más útil cuando trabajes con niños de preprimaria y por qué?',
  PREGUNTAS_TRABAJO: [
    '¿Cuál es el propósito principal de tu planificación y cómo contribuye al desarrollo de la competencia comunicativa de los niños y las niñas?',
    '¿Qué estrategias incluiste en tu planificación para favorecer la expresión oral, la escucha y la participación infantil?',
    '¿Por qué seleccionaste esas actividades y recursos didácticos para trabajar con niños de preprimaria?',
    '¿Cómo comprobarías que los niños y las niñas están desarrollando las habilidades comunicativas que planteaste?'
  ],
  PISTAS_DEFENSA: [
    'Ten a la mano la planificación que elaboraste durante el curso y revisa su propósito y sus actividades.',
    'Piensa en una actividad concreta de tu planificación y en cómo participarían los niños y las niñas.',
    'Escribe con tus propias palabras; como orientación, entre 50 y 120 palabras por respuesta.'
  ],
  vista: null,
  timers: [],

  datos(id){ return BANCO_RETOS.planificacion.find(x => x.id === id) || null; },
  asignadas(api){
    const a = api.asignacion;
    return (a && Array.isArray(a.situaciones) ? a.situaciones : []).filter(id => this.datos(id));
  },
  orden(api, id){
    const d = this.datos(id), a = api.asignacion;
    const o = a && a.ordenes && Array.isArray(a.ordenes[id]) ? a.ordenes[id] : null;
    const validas = d.opciones.map(x => x.id);
    return o && o.length === validas.length && validas.every(x => o.includes(x)) ? o : validas;
  },
  decisiones(api){ const d = api.respuestas.decisiones; return d && typeof d === 'object' ? d : {}; },
  resuelta(api, id){ const d = this.decisiones(api)[id]; return !!(d && d.resuelta); },
  todasResueltas(api, ids){ return ids.every(id => this.resuelta(api, id)); },

  limpiar(){ this.timers.forEach(t => clearTimeout(t)); this.timers = []; this.vista = null; },
  despues(ms, fn){
    const v = this.vista;
    const t = setTimeout(() => {
      this.timers = this.timers.filter(x => x !== t);
      if (v && this.vista === v && v.cont.isConnected) fn(v);
    }, ms);
    this.timers.push(t);
  },

  /* ---------- Entrada ---------- */
  montar(cont, api, esReinicio){
    this.limpiar();
    const ids = this.asignadas(api);
    if (!ids.length) throw new Error('La asignación de situaciones no es válida.');
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return this.mostrarConsulta(cont, api, ids);
    const idsJuego = this.ampliarAsignacion(api);
    if (!api.respuestas.iniciado) {
      const yaJugo = fe.intentos.some(i => i.respuestas && i.respuestas.iniciado);
      if (!esReinicio && !yaJugo) return this.mostrarIntro(cont, api, idsJuego);
      this.iniciarRespuestas(api);
    }
    this.vista = { cont, api, ids: idsJuego, seleccion: null, finalizando: false };
    this.pintar();
  },
  /* Partidas iniciadas con la versión de 5 situaciones: se agregan las que faltan
     al final, conservando las ya asignadas, su orden y todas las respuestas. */
  ampliarAsignacion(api){
    const fe = api.estadoFase, a = fe.asignacion;
    const actuales = this.asignadas(api);
    if (actuales.length >= this.CANTIDAD || !a) return actuales;
    const disponibles = BANCO_RETOS.planificacion.map(x => x.id).filter(id => !actuales.includes(id));
    const nuevas = Azar.elegir(disponibles, this.CANTIDAD - actuales.length);
    const ordenes = Object.assign({}, a.ordenes || {});
    nuevas.forEach(id => { ordenes[id] = Azar.barajar(this.datos(id).opciones.map(o => o.id)); });
    fe.asignacion = Object.assign({}, a, { situaciones: actuales.concat(nuevas), ordenes, ampliadaDe: actuales.length, fechaAmpliacion: ahoraISO() });
    api.registrarEvento(`La misión se amplió de ${actuales.length} a ${this.CANTIDAD} situaciones; se conservaron las respuestas anteriores.`);
    api.guardar();
    return this.asignadas(api);
  },
  iniciarRespuestas(api){
    api.responder('iniciado', true);
    api.responder('indice', 0);
    api.responder('decisiones', {});
    api.responder('estadoPistas', {});
    api.registrarEvento('Comenzó a defender su planificación');
    api.guardar();
  },
  mostrarIntro(cont, api, ids){
    const n = esc(primerNombre(api.nombre));
    cont.innerHTML = `
      <div class="tarjeta">
        ${globoAurora(`<p>¡<strong>${n}</strong>, hemos llegado a una misión muy especial! Durante este año aprendiste a crear experiencias para que los niños y las niñas se expresen, jueguen, escuchen y se comuniquen. Ahora quiero conocer cómo piensas como futura maestra. Te presentaré algunos desafíos y tú decidirás qué harías en cada situación. ¿Aceptas el reto?</p>`)}
        <button type="button" id="btnPlComenzar" class="btn btn-primario btn-mision">¡Acepto el desafío!</button>
      </div>`;
    cont.querySelector('#btnPlComenzar').addEventListener('click', () => {
      api.registrarEvento('Escuchó la presentación de Aurora');
      this.iniciarRespuestas(api);
      this.vista = { cont, api, ids, seleccion: null, finalizando: false };
      this.pintar();
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },

  /* ---------- Pantallas ---------- */
  indiceActual(){
    const v = this.vista;
    const i = Number(v.api.respuestas.indice) || 0;
    // Nunca adelantarse a una situación sin resolver las anteriores
    const primeraPendiente = v.ids.findIndex(id => !this.resuelta(v.api, id));
    return primeraPendiente < 0 ? Math.min(i, v.ids.length) : Math.min(i, primeraPendiente);
  },
  pintar(){
    const v = this.vista; if (!v) return;
    const i = this.indiceActual();
    if (i >= v.ids.length) return this.pintarDefensa();
    this.pintarSituacion(i);
  },
  pintarSituacion(i){
    const v = this.vista, api = v.api, id = v.ids[i], d = this.datos(id);
    const reg = this.decisiones(api)[id] || { intentos: [], resuelta: false };
    const descartadas = new Set(reg.intentos.filter(x => !x.adecuada).map(x => x.opcion));
    const correcta = d.opciones.find(o => o.correcta).id;
    const letras = ['A', 'B', 'C', 'D'];
    const opciones = this.orden(api, id).map((oid, k) => {
      const o = d.opciones.find(x => x.id === oid);
      const estadoOp = reg.resuelta && oid === correcta ? 'adecuada' : descartadas.has(oid) ? 'descartada' : (v.seleccion === oid ? 'seleccionada' : '');
      const bloqueada = reg.resuelta || descartadas.has(oid);
      return `<button type="button" class="pl-opcion ${estadoOp}" data-op="${oid}" role="radio" aria-checked="${v.seleccion === oid || (reg.resuelta && oid === correcta)}" ${bloqueada ? 'disabled' : ''}>
        <span class="pl-letra">${letras[k]}</span><span class="pl-txt">${esc(o.texto)}</span>
        ${estadoOp === 'descartada' ? '<span class="pl-marca">Reconsiderada</span>' : estadoOp === 'adecuada' ? '<span class="pl-marca ok">✓ Tu decisión</span>' : ''}</button>`;
    }).join('');
    const ultimo = reg.intentos[reg.intentos.length - 1];
    let retro = '';
    if (reg.resuelta) retro = `<div class="pl-retro ok">${globoAurora(`<p><strong>¡Buena decisión!</strong> ${esc(d.acierto)}</p>`)}</div>`;
    else if (ultimo && !ultimo.adecuada) retro = `<div class="pl-retro revisar">${globoAurora(`<p><strong>Vale la pena reconsiderarlo.</strong> ${esc(ultimo.retroalimentacion)}</p><p>Elige otra opción y vuelve a confirmar.</p>`)}</div>`;
    v.cont.innerHTML = `
      <div class="tarjeta pl-sit">
        <div class="pl-cab"><span class="pl-num">Desafío ${i + 1} de ${v.ids.length}</span></div>
        <div class="barra"><span style="width:${Math.round(i / v.ids.length * 100)}%"></span></div>
        <h3>${d.emoji} ${esc(d.tema)}</h3>
        <p class="pl-texto">${esc(d.situacion)}</p>
        <p class="pl-pregunta">¿Qué harías como maestra?</p>
        <div class="pl-opciones" role="radiogroup" aria-label="Decisiones posibles">${opciones}</div>
        <div id="plRetro" aria-live="polite">${retro}</div>
        ${reg.resuelta
          ? `<button type="button" id="plSiguiente" class="btn btn-primario">${i + 1 < v.ids.length ? 'Siguiente desafío ➡️' : 'Continuar ➡️'}</button>`
          : `<button type="button" id="plConfirmar" class="btn btn-primario" ${v.seleccion ? '' : 'disabled'}>Confirmar mi decisión</button>`}
      </div>`;
    v.cont.querySelectorAll('.pl-opcion:not([disabled])').forEach(b => b.addEventListener('click', () => {
      v.seleccion = b.dataset.op;
      v.cont.querySelectorAll('.pl-opcion').forEach(x => {
        const sel = x.dataset.op === v.seleccion;
        x.classList.toggle('seleccionada', sel); x.setAttribute('aria-checked', sel);
      });
      const c = v.cont.querySelector('#plConfirmar'); if (c) c.disabled = false;
    }));
    const conf = v.cont.querySelector('#plConfirmar');
    if (conf) conf.addEventListener('click', () => this.confirmar(i));
    const sig = v.cont.querySelector('#plSiguiente');
    if (sig) sig.addEventListener('click', () => {
      v.api.responder('indice', i + 1); v.api.guardar(); v.seleccion = null;
      this.pintar();
      try { v.cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },
  confirmar(i){
    const v = this.vista, api = v.api, id = v.ids[i], d = this.datos(id);
    if (!v.seleccion || this.resuelta(api, id)) return;
    const o = d.opciones.find(x => x.id === v.seleccion); if (!o) return;
    const dec = copiaProfunda(this.decisiones(api));
    const reg = dec[id] || { intentos: [], resuelta: false };
    const retroTexto = o.correcta ? d.acierto : o.retro;
    reg.intentos.push({ opcion: o.id, texto: o.texto, adecuada: o.correcta, retroalimentacion: retroTexto, fecha: ahoraISO() });
    if (o.correcta) reg.resuelta = true;
    dec[id] = reg;
    api.responder('decisiones', dec);
    api.registrarEvento(`Desafío «${d.tema}»: ${o.correcta ? 'eligió la decisión más adecuada' : 'eligió una opción para reconsiderar'}`, { opcion: o.id });
    api.guardar();
    v.seleccion = null;
    this.pintarSituacion(i);
    try { v.cont.querySelector('#plRetro').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  },

  /* Sección final: «Ahora defiende tu propio trabajo» (4 preguntas abiertas) */
  pintarDefensa(){
    const v = this.vista, api = v.api, n = this.PREGUNTAS_TRABAJO.length;
    if (Array.isArray(api.respuestas.preguntasAbiertas) && api.respuestas.preguntasAbiertas.length === n) {
      v.cont.innerHTML = `<div class="tarjeta"><h3>🛡️ Ahora defiende tu propio trabajo</h3>${PreguntasAbiertas.lectura(api.respuestas.preguntasAbiertas)}</div><div id="plFinal"></div>`;
      return this.finalizar();
    }
    const borr = api.respuestas.borradorTrabajo && Array.isArray(api.respuestas.borradorTrabajo.textos) ? api.respuestas.borradorTrabajo.textos : [];
    const anterior = api.respuestas.defensa && api.respuestas.defensa.respuesta;
    v.cont.innerHTML = `
      <div class="tarjeta pa-seccion">
        <div class="barra"><span style="width:100%"></span></div>
        ${globoAurora(`<p>¡Superaste los ${v.ids.length === 10 ? 'diez' : v.ids.length} desafíos, <strong>${esc(primerNombre(api.nombre))}</strong>! Ahora quiero conocer tu propio trabajo. Ten a la mano la planificación que elaboraste durante el curso y responde con tus propias palabras.</p>`)}
        <h3>🛡️ Ahora defiende tu propio trabajo</h3>
        <p class="pa-guia">Como orientación, escribe entre 50 y 120 palabras por respuesta. No es un límite: lo importante es que expliques tu trabajo.</p>
        ${anterior ? `<div class="pa-anterior"><small>Tu reflexión anterior quedó guardada:</small><div class="cita">${esc(anterior)}</div></div>` : ''}
        ${PreguntasAbiertas.html('plPa', this.PREGUNTAS_TRABAJO, borr)}
        <p class="error" id="plError" role="alert"></p>
        <button type="button" id="plEntregar" class="btn btn-primario">📨 Entregar mis respuestas</button>
      </div>
      <div id="plFinal"></div>`;
    const error = v.cont.querySelector('#plError');
    PreguntasAbiertas.enlazar(v.cont, n, textos => { error.textContent = ''; api.responder('borradorTrabajo', { textos }); });
    v.cont.querySelector('#plEntregar').addEventListener('click', ev => {
      if (!this.todasResueltas(api, v.ids)) { this.pintar(); return; }
      const textos = PreguntasAbiertas.textos(v.cont, n);
      const k = PreguntasAbiertas.primeraIncompleta(textos);
      if (k >= 0) {
        error.textContent = `Completa la respuesta ${k + 1} con tus propias palabras antes de entregar.`;
        v.cont.querySelector(`[data-pa="${k}"]`).focus(); return;
      }
      ev.currentTarget.disabled = true;
      v.cont.querySelectorAll('[data-pa]').forEach(t => { t.disabled = true; });
      api.responder('preguntasAbiertas', PreguntasAbiertas.registro('planificacion', this.PREGUNTAS_TRABAJO, textos));
      api.registrarEvento('Entregó sus respuestas de «Ahora defiende tu propio trabajo»');
      this.finalizar();
    });
  },

  finalizar(){
    const v = this.vista;
    if (!v || v.finalizando) return;
    v.finalizando = true;
    const api = v.api, fe = api.estadoFase, it = intentoAbierto(fe), dec = this.decisiones(api);
    const texto = `¡Excelente trabajo, ${primerNombre(api.nombre)}! Has demostrado que puedes tomar decisiones pensando en las necesidades de los niños y las niñas. Una buena planificación no es solamente un documento: es una herramienta para crear oportunidades de aprendizaje. ¡Vamos por nuestra siguiente misión!`;
    const final = v.cont.querySelector('#plFinal');
    if (final) final.innerHTML = `<div class="tarjeta mem-celebracion"><span class="confeti" aria-hidden="true">🎉🛡️✨🛡️🎉</span>${globoAurora(`<p>${esc(texto)}</p>`)}</div>`;
    const resultado = {
      situaciones: v.ids.map((id, i) => {
        const d = this.datos(id), r = dec[id] || { intentos: [] };
        return { numero: i + 1, tema: d.tema, situacion: d.situacion,
                 ordenAlternativas: this.orden(api, id).map(o => d.opciones.find(x => x.id === o).texto),
                 decisionAdecuada: d.opciones.find(o => o.correcta).texto,
                 decisionesElegidas: r.intentos.map(x => x.texto),
                 intentos: r.intentos.length,
                 retroalimentacion: r.intentos.map(x => x.retroalimentacion) };
      }),
      defensa: api.respuestas.defensa || null,                       // Reflexión anterior (si existía), se conserva
      preguntasAbiertas: api.respuestas.preguntasAbiertas || null,   // «Ahora defiende tu propio trabajo»
      intentos: fe.intentos.length,
      pistasIntento: it ? it.pistas : 0,
      pistasTotales: fe.pistas.length,
      pistasUtilizadas: fe.pistas.map(p => p.texto),
      fechaInicio: fe.fechaInicio,
      fechaFinalizacion: ahoraISO()
    };
    api.guardar();
    this.despues(1400, () => api.completar(resultado, { mensaje: texto }));
  },

  /* ---------- Pistas ---------- */
  pistaDisponible(api){
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return 'Ya completaste esta misión.';
    if (!this.vista) return 'Primero presiona «¡Acepto el desafío!».';
    if (this.vista.finalizando) return '¡Ya completaste los desafíos!';
    return true;
  },
  pista(api){
    const v = this.vista; if (!v) return null;
    const i = this.indiceActual();
    const st = Object.assign({}, api.respuestas.estadoPistas || {});
    if (i >= v.ids.length) {
      const n = Number(st.defensa) || 0; st.defensa = n + 1; api.responder('estadoPistas', st);
      return this.PISTAS_DEFENSA[n % this.PISTAS_DEFENSA.length];
    }
    const id = v.ids[i], d = this.datos(id);
    if (this.resuelta(api, id)) return '¡Ya encontraste la decisión más adecuada! Presiona «Siguiente desafío».';
    const n = Number(st[id]) || 0; st[id] = n + 1; api.responder('estadoPistas', st);
    return d.pistas[n % d.pistas.length];
  },

  /* ---------- Consulta ---------- */
  mostrarConsulta(cont, api, ids){
    const res = api.estadoFase.resultado || {};
    const defensa = res.defensa && res.defensa.respuesta;
    if (Array.isArray(res.situaciones) && res.situaciones.length) {
      const porTema = {}; BANCO_RETOS.planificacion.forEach(d => { porTema[d.tema] = d.id; });
      const delResultado = res.situaciones.map(x => porTema[x.tema]).filter(Boolean);
      if (delResultado.length) ids = delResultado;
    }
    const fe = api.estadoFase;
    const abiertas = Array.isArray(res.preguntasAbiertas) ? res.preguntasAbiertas : null;
    const pedir = !abiertas && !fe.completadaEnPrueba;
    cont.innerHTML = `
      ${abiertas ? `<div class="tarjeta"><h3>🛡️ Ahora defiende tu propio trabajo</h3>${PreguntasAbiertas.lectura(abiertas)}</div>` : ''}
      ${pedir ? `<div class="tarjeta pa-seccion tarjeta-ampliar" id="plAmpliar">
        ${globoAurora(`<p><strong>${esc(primerNombre(api.nombre))}</strong>, ahora esta misión incluye una sección para defender tu propio trabajo. Tu logro se conserva; responde estas preguntas tomando como referencia la planificación que elaboraste.</p>`)}
        <h3>🛡️ Ahora defiende tu propio trabajo</h3>
        <p class="pa-guia">Como orientación, escribe entre 50 y 120 palabras por respuesta.</p>
        ${PreguntasAbiertas.html('plPa', this.PREGUNTAS_TRABAJO, (fe.respuestas.borradorTrabajo && fe.respuestas.borradorTrabajo.textos) || [])}
        <p class="error" id="plError" role="alert"></p>
        <button type="button" id="plGuardarAbiertas" class="btn btn-primario">📨 Entregar mis respuestas</button>
      </div>` : ''}
      <div class="tarjeta">
        <h3>🛡️ Tus decisiones como futura maestra</h3>
        ${ids.map((id, i) => { const d = this.datos(id); return `
          <div class="pl-resumen"><strong>${i + 1}. ${d.emoji} ${esc(d.tema)}</strong>
            <p>${esc(d.situacion)}</p>
            <p class="pl-adecuada">✓ ${esc(d.opciones.find(o => o.correcta).texto)}</p>
            <p><small>${esc(d.acierto)}</small></p></div>`; }).join('')}
      </div>
      ${defensa ? `<div class="tarjeta"><h3>💭 Tu reflexión anterior</h3><p><small>${esc(this.PREGUNTA)}</small></p><div class="cita">${esc(defensa)}</div></div>` : ''}
      <p class="ayuda" style="text-align:center;margin-bottom:12px">Si quieres, puedes usar «Jugar de nuevo»: tus respuestas originales se conservan.</p>`;
    if (pedir) this.enlazarAmpliacion(cont, api, ids);
  },
  /* Misión completada antes de esta versión: agregar las 4 respuestas sin perder el logro */
  enlazarAmpliacion(cont, api, ids){
    const fe = api.estadoFase, n = this.PREGUNTAS_TRABAJO.length, error = cont.querySelector('#plError');
    PreguntasAbiertas.enlazar(cont, n, textos => { error.textContent = ''; fe.respuestas.borradorTrabajo = { textos }; guardarAuto(); });
    cont.querySelector('#plGuardarAbiertas').addEventListener('click', async ev => {
      const textos = PreguntasAbiertas.textos(cont, n);
      const k = PreguntasAbiertas.primeraIncompleta(textos);
      if (k >= 0) { error.textContent = `Completa la respuesta ${k + 1} con tus propias palabras antes de entregar.`; cont.querySelector(`[data-pa="${k}"]`).focus(); return; }
      ev.currentTarget.disabled = true;
      const registro = PreguntasAbiertas.registro('planificacion', this.PREGUNTAS_TRABAJO, textos);
      iniciarIntento(fe);
      api.responder('preguntasAbiertas', registro);
      api.registrarEvento('Agregó sus respuestas de «Ahora defiende tu propio trabajo» a la misión completada');
      await api.completar(Object.assign({}, fe.resultado, { preguntasAbiertas: registro, fechaPreguntasAbiertas: ahoraISO() }), { actualizarResultado: true, permanecer: true });
      toast('📨 ¡Tus respuestas quedaron guardadas!');
      this.mostrarConsulta(cont, api, ids);
    });
  }
};

registrarMotor('planificacion', {
  asignar(azar, bancos){
    const banco = (bancos && bancos.retos && bancos.retos.planificacion) || [];
    const situaciones = azar.elegir(banco.map(x => x.id), Planificacion.CANTIDAD);
    const ordenes = {};
    situaciones.forEach(id => {
      const ops = banco.find(x => x.id === id).opciones.map(o => o.id);
      let o = azar.barajar(ops);
      ordenes[id] = o;
    });
    // Evitar que la opción adecuada quede siempre en la misma posición
    const pos = situaciones.map(id => ordenes[id].indexOf(banco.find(x => x.id === id).opciones.find(o => o.correcta).id));
    if (new Set(pos).size === 1 && situaciones.length > 1) {
      const id = situaciones[situaciones.length - 1];
      ordenes[id] = ordenes[id].slice(1).concat(ordenes[id][0]);
    }
    return { situaciones, ordenes, fecha: ahoraISO() };
  },
  iniciar(contenedor, api){ Planificacion.montar(contenedor, api, false); },
  reiniciar(contenedor, api){ Planificacion.montar(contenedor, api, true); },
  pista(api){ return Planificacion.pista(api); },
  pistaDisponible(api){ return Planificacion.pistaDisponible(api); }
});

/* =========================================================
   13.6 MOTOR · FASE 5: «Mi ruta de aprendizaje semanal»
   - Ocho estaciones temáticas (síntesis del curso, sin fechas).
   - Se ordenan intercambiando tarjetas: tocar una y luego otra,
     botones ▲ ▼, o arrastrar y soltar en computadoras.
   - Datos del intento (api.respuestas):
       ordenInicial [ids], orden [ids], fijas [ids correctas comprobadas],
       revisar [ids], comprobaciones, historialComprobaciones
       [{correctas, orden, fecha}], estadoPistas {n}, completa
   ========================================================= */
const Ruta = {
  vista: null,
  timers: [],
  DURACION_PISTA: 3200,
  PREGUNTAS_AULA: [
    'Al revisar el trabajo que desarrollaste durante el curso, ¿qué aprendizajes consideras más importantes para tu formación como futura docente de preprimaria?',
    '¿Cómo se relacionan las actividades y estrategias que organizaste con el desarrollo del lenguaje y la comunicación infantil?',
    'Selecciona una de las experiencias de aprendizaje que elaboraste y explica cómo la aplicarías con un grupo de niños y niñas de preprimaria.',
    '¿Qué mejorarías o adaptarías de tu trabajo para atender las diferentes necesidades y ritmos de aprendizaje de los niños y las niñas?'
  ],
  htmlFormularioAula(valores, boton){
    return `
      <h3>🎒 Los aprendizajes que llevaré a mi aula</h3>
      <p class="pa-guia">Responde con base en los documentos y experiencias que elaboraste durante el curso. Como orientación, entre 50 y 120 palabras por respuesta. Puedes revisar y editar tus respuestas antes de finalizar.</p>
      ${PreguntasAbiertas.html('rutaPa', this.PREGUNTAS_AULA, valores)}
      <p class="error" id="rutaError" role="alert"></p>
      <button type="button" id="rutaGuardarAbiertas" class="btn btn-primario">${boton}</button>`;
  },

  estaciones(){ return BANCO_RETOS.ruta.slice().sort((a, b) => a.orden - b.orden); },
  correcto(){ return this.estaciones().map(e => e.id); },
  datos(id){ return BANCO_RETOS.ruta.find(e => e.id === id) || null; },
  ordenValido(o){
    const c = this.correcto();
    return Array.isArray(o) && o.length === c.length && c.every(id => o.includes(id));
  },
  r(){ return this.vista.api.respuestas; },
  orden(){ return this.r().orden.slice(); },
  fijas(){ return new Set(Array.isArray(this.r().fijas) ? this.r().fijas : []); },
  revisar(){ return new Set(Array.isArray(this.r().revisar) ? this.r().revisar : []); },
  bienColocadas(orden){ const c = this.correcto(); return orden.filter((id, i) => c[i] === id); },

  limpiar(){ this.timers.forEach(t => clearTimeout(t)); this.timers = []; this.vista = null; },
  despues(ms, fn){
    const v = this.vista;
    const t = setTimeout(() => {
      this.timers = this.timers.filter(x => x !== t);
      if (v && this.vista === v && v.cont.isConnected) fn(v);
    }, ms);
    this.timers.push(t);
  },

  /* Mezcla que obliga a organizar: distinta del orden correcto, con 2 o menos en su lugar */
  mezclar(anterior){
    const c = this.correcto();
    let o;
    for (let k = 0; k < 200; k++) {
      o = Azar.barajar(c);
      if (this.bienColocadas(o).length <= 2 && (!anterior || JSON.stringify(o) !== JSON.stringify(anterior))) break;
    }
    return o;
  },

  /* ---------- Entrada ---------- */
  montar(cont, api, esReinicio){
    this.limpiar();
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return this.mostrarConsulta(cont, api);
    if (!api.respuestas.iniciado || !this.ordenValido(api.respuestas.orden)) {
      const yaJugo = fe.intentos.some(i => i.respuestas && i.respuestas.iniciado);
      if (!api.respuestas.iniciado && !esReinicio && !yaJugo) return this.mostrarIntro(cont, api);
      this.iniciarRespuestas(api);
    }
    this.mostrarJuego(cont, api);
  },
  iniciarRespuestas(api){
    const fe = api.estadoFase;
    const previo = fe.intentos.slice().reverse().find(i => i.estado !== 'en_curso' && i.respuestas && Array.isArray(i.respuestas.ordenInicial));
    const o = this.mezclar(previo ? previo.respuestas.ordenInicial : null);
    api.responder('iniciado', true);
    api.responder('ordenInicial', o.slice());
    api.responder('orden', o.slice());
    api.responder('fijas', []);
    api.responder('revisar', []);
    api.responder('comprobaciones', 0);
    api.responder('historialComprobaciones', []);
    api.responder('estadoPistas', { n: 0 });
    api.registrarEvento('Se mezclaron las estaciones de la ruta');
    api.guardar();
  },
  mostrarIntro(cont, api){
    const n = esc(primerNombre(api.nombre));
    cont.innerHTML = `
      <div class="tarjeta">
        ${globoAurora(`<p>¡<strong>${n}</strong>, qué lejos hemos llegado! Durante nuestras clases descubrimos que la comunicación se desarrolla de muchas maneras: hablando, escuchando, jugando, contando historias y expresándonos con creatividad. Ahora vamos a reconstruir nuestra ruta de aprendizaje. ¿Podrás organizar las experiencias que nos ayudaron a llegar hasta aquí?</p>`)}
        <button type="button" id="btnRutaComenzar" class="btn btn-primario btn-mision">¡Reconstruir mi ruta!</button>
      </div>`;
    cont.querySelector('#btnRutaComenzar').addEventListener('click', () => {
      api.registrarEvento('Escuchó la presentación de Aurora');
      this.iniciarRespuestas(api);
      this.mostrarJuego(cont, api);
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },

  /* ---------- Camino de estaciones ---------- */
  htmlPaso(id, pos, opciones){
    const d = this.datos(id);
    const { fija, revisar, seleccionada, interactivo, primero, ultimo } = opciones;
    const clases = ['ruta-paso', fija ? 'fija' : '', revisar ? 'revisar' : '', seleccionada ? 'seleccionada' : ''].join(' ');
    return `<li class="${clases}" data-id="${id}" style="--color-est:${d.color}">
      <span class="ruta-pos" data-pos="${pos}">${pos + 1}</span>
      <div class="ruta-tarjeta" data-id="${id}" ${interactivo && !fija ? `role="button" tabindex="0" draggable="true" aria-pressed="${!!seleccionada}"` : ''}
           aria-label="Posición ${pos + 1}: ${esc(d.titulo)}${fija ? ', en su lugar' : ''}">
        <span class="ruta-icono" aria-hidden="true">${d.icono}</span>
        <span class="ruta-info"><strong>${esc(d.titulo)}</strong><small>${esc(d.descripcion)}</small></span>
        ${!interactivo ? '' : fija ? `<span class="ruta-estado ok" aria-hidden="true">✓</span>`
          : `<span class="ruta-mover">
               <button type="button" data-mover="-1" aria-label="Subir «${esc(d.titulo)}»" ${primero ? 'disabled' : ''}>▲</button>
               <button type="button" data-mover="1" aria-label="Bajar «${esc(d.titulo)}»" ${ultimo ? 'disabled' : ''}>▼</button>
             </span>`}
        ${interactivo && revisar ? `<span class="ruta-marca">🔄 Cambiar</span>` : ''}
      </div>
    </li>`;
  },
  mostrarJuego(cont, api){
    cont.innerHTML = `
      <div class="tarjeta ruta-panel">
        <p class="sopa-contador" id="rutaContador"></p>
        <p class="ayuda" id="rutaAyuda" style="text-align:center;margin:4px 0 10px"></p>
        <div class="ruta-inicio">🌱 Inicio del curso</div>
        <ol class="ruta-camino" id="rutaCamino"></ol>
        <div class="ruta-meta">🎓 Futuras maestras</div>
        <p class="cru-mensaje" id="rutaMensaje" aria-live="polite"></p>
        <button type="button" id="rutaComprobar" class="btn btn-primario">🧭 Comprobar mi ruta</button>
      </div>
      <div id="rutaFinal"></div>`;
    this.vista = { cont, api, seleccion: null, finalizando: false };
    this.pintar();
    this.enlazar();
    if (api.respuestas.completa) this.celebrar(false);
  },
  pintar(){
    const v = this.vista; if (!v) return;
    const orden = this.orden(), fijas = this.fijas(), revisar = this.revisar();
    const libres = orden.map((id, i) => fijas.has(id) ? -1 : i).filter(i => i >= 0);
    v.cont.querySelector('#rutaCamino').innerHTML = orden.map((id, i) => this.htmlPaso(id, i, {
      fija: fijas.has(id), revisar: revisar.has(id), seleccionada: v.seleccion === id, interactivo: !v.finalizando,
      primero: i <= libres[0], ultimo: i >= libres[libres.length - 1]
    })).join('');
    const k = Number(this.r().comprobaciones) || 0;
    v.cont.querySelector('#rutaContador').textContent = k
      ? `Estaciones correctas: ${fijas.size} de ${orden.length}` : `Organiza las ${orden.length} estaciones de tu ruta`;
    v.cont.querySelector('#rutaAyuda').textContent = v.finalizando ? ''
      : v.seleccion ? `Ahora toca la estación con la que quieres intercambiar «${this.datos(v.seleccion).titulo}».`
      : 'Toca una estación y luego otra para intercambiarlas, o usa ▲ ▼. En computadora también puedes arrastrarlas.';
    const btn = v.cont.querySelector('#rutaComprobar'); if (btn) btn.hidden = v.finalizando;
  },
  enlazar(){
    const v = this.vista, camino = v.cont.querySelector('#rutaCamino');
    camino.addEventListener('click', e => {
      if (v.finalizando) return;
      const mover = e.target.closest('button[data-mover]');
      if (mover) { this.moverVecino(mover.closest('.ruta-paso').dataset.id, +mover.dataset.mover); return; }
      const t = e.target.closest('.ruta-tarjeta'); if (!t) return;
      this.tocar(t.dataset.id);
    });
    camino.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ruta-tarjeta')) { e.preventDefault(); this.tocar(e.target.dataset.id); }
    });
    // Arrastrar y soltar (computadoras)
    camino.addEventListener('dragstart', e => {
      const t = e.target.closest('.ruta-tarjeta'); if (!t || v.finalizando) return;
      v.arrastrando = t.dataset.id;
      try { e.dataTransfer.setData('text/plain', t.dataset.id); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
    });
    camino.addEventListener('dragover', e => { if (v.arrastrando) e.preventDefault(); });
    camino.addEventListener('drop', e => {
      e.preventDefault();
      const destino = e.target.closest('.ruta-paso');
      if (v.arrastrando && destino) this.intercambiar(v.arrastrando, destino.dataset.id);
      v.arrastrando = null;
    });
    camino.addEventListener('dragend', () => { v.arrastrando = null; });
    v.cont.querySelector('#rutaComprobar').addEventListener('click', () => this.comprobar());
  },
  tocar(id){
    const v = this.vista;
    if (this.fijas().has(id)) { toast('✓ Esta estación ya está en su lugar'); return; }
    if (!v.seleccion) { v.seleccion = id; this.pintar(); return; }
    if (v.seleccion === id) { v.seleccion = null; this.pintar(); return; }
    this.intercambiar(v.seleccion, id);
  },
  intercambiar(a, b){
    const v = this.vista, fijas = this.fijas();
    if (a === b || fijas.has(a) || fijas.has(b)) { v.seleccion = null; this.pintar(); return; }
    const o = this.orden(), i = o.indexOf(a), j = o.indexOf(b);
    if (i < 0 || j < 0) return;
    [o[i], o[j]] = [o[j], o[i]];
    this.guardarOrden(o, [a, b]);
  },
  moverVecino(id, paso){
    const o = this.orden(), fijas = this.fijas();
    let j = o.indexOf(id) + paso;
    while (j >= 0 && j < o.length && fijas.has(o[j])) j += paso;    // Saltar estaciones ya fijas
    if (j < 0 || j >= o.length) return;
    this.intercambiar(id, o[j]);
  },
  guardarOrden(o, movidas){
    const v = this.vista, api = v.api;
    api.responder('orden', o);
    api.responder('revisar', [...this.revisar()].filter(id => !movidas.includes(id)));
    v.seleccion = null;
    this.pintar();
    movidas.forEach(id => { const el = v.cont.querySelector(`.ruta-paso[data-id="${id}"] .ruta-tarjeta`); if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } });
  },

  /* ---------- Comprobación ---------- */
  comprobar(){
    const v = this.vista; if (!v || v.finalizando) return;
    const api = v.api, o = this.orden(), c = this.correcto();
    const correctas = o.filter((id, i) => c[i] === id), incorrectas = o.filter((id, i) => c[i] !== id);
    const n = (Number(api.respuestas.comprobaciones) || 0) + 1;
    api.responder('comprobaciones', n);
    api.responder('fijas', correctas);
    api.responder('revisar', incorrectas);
    const hist = Array.isArray(api.respuestas.historialComprobaciones) ? api.respuestas.historialComprobaciones.slice() : [];
    hist.push({ correctas: correctas.length, orden: o.slice(), fecha: ahoraISO() });
    api.responder('historialComprobaciones', hist);
    api.registrarEvento(`Comprobó su ruta: ${correctas.length} de ${o.length} estaciones correctas`);
    api.guardar();
    v.seleccion = null;
    if (!incorrectas.length) { this.celebrar(true); return; }
    this.pintar();
    const el = v.cont.querySelector('#rutaMensaje');
    el.textContent = correctas.length
      ? `¡Vas muy bien! Las estaciones en verde ya están en su lugar. Mueve las marcadas con 🔄.`
      : '¡Buen comienzo! Ninguna estación coincide todavía; piensa qué aprendimos primero y qué vino después.';
  },

  /* ---------- Celebración: el camino completo ---------- */
  /* Ruta correcta: el camino se transforma y aparecen las 4 preguntas abiertas.
     La misión se completa solo al guardar las respuestas. */
  celebrar(nuevo){
    const v = this.vista; if (!v || v.finalizando) return;
    v.finalizando = true;
    const api = v.api, fe = api.estadoFase, r = api.respuestas;
    if (nuevo) { api.responder('completa', true); api.registrarEvento('Reconstruyó la ruta completa'); api.guardar(); }
    this.pintar();
    const camino = v.cont.querySelector('#rutaCamino');
    camino.classList.add('completa');
    v.cont.querySelector('#rutaMensaje').textContent = '';
    const texto = `¡Lo conseguiste, ${primerNombre(api.nombre)}! Has reconstruido una ruta llena de aprendizajes. Cada experiencia nos ayudó a comprender mejor cómo acompañar el desarrollo comunicativo de los niños y las niñas. Y lo mejor es que ahora tienes herramientas para llevar esos aprendizajes a tu futura aula.`;
    // Borrador propio, o las respuestas anteriores si vuelve a jugar una misión ya completada
    const previas = fe.resultado && Array.isArray(fe.resultado.preguntasAbiertas) ? fe.resultado.preguntasAbiertas.map(x => x.respuesta) : [];
    const borr = r.borradorAula && Array.isArray(r.borradorAula.textos) ? r.borradorAula.textos : previas;
    v.cont.querySelector('#rutaFinal').innerHTML = `
      <div class="tarjeta mem-celebracion"><span class="confeti" aria-hidden="true">🎉🗺️✨🗺️🎉</span>${globoAurora(`<p>${esc(texto)}</p>`)}
        <button type="button" id="rutaRecorrer" class="btn btn-secundario">▶️ Recorrer mi ruta</button>
      </div>
      <div class="tarjeta pa-seccion" id="rutaAula">
        ${globoAurora(`<p>Antes de terminar esta misión, quiero saber qué aprendizajes llevarás a tu futura aula. Responde con tus propias palabras.</p>`)}
        ${this.htmlFormularioAula(borr, '📨 Guardar mis respuestas y finalizar')}
      </div>`;
    const recorrer = () => { camino.classList.remove('recorriendo'); void camino.offsetWidth; camino.classList.add('recorriendo'); try { camino.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} };
    v.cont.querySelector('#rutaRecorrer').addEventListener('click', recorrer);
    camino.classList.add('recorriendo');
    const zona = v.cont.querySelector('#rutaAula'), error = zona.querySelector('#rutaError'), n = this.PREGUNTAS_AULA.length;
    PreguntasAbiertas.enlazar(zona, n, textos => { error.textContent = ''; api.responder('borradorAula', { textos }); });
    zona.querySelector('#rutaGuardarAbiertas').addEventListener('click', async ev => {
      const textos = PreguntasAbiertas.textos(zona, n);
      const k = PreguntasAbiertas.primeraIncompleta(textos);
      if (k >= 0) { error.textContent = `Completa la respuesta ${k + 1} con tus propias palabras antes de finalizar.`; zona.querySelector(`[data-pa="${k}"]`).focus(); return; }
      ev.currentTarget.disabled = true;
      const registro = PreguntasAbiertas.registro('ruta', this.PREGUNTAS_AULA, textos);
      api.responder('preguntasAbiertas', registro);
      api.registrarEvento('Guardó sus respuestas de «Los aprendizajes que llevaré a mi aula»');
      const it = intentoAbierto(fe);
      const hist = Array.isArray(r.historialComprobaciones) ? r.historialComprobaciones : [];
      const resultado = {
        ordenInicial: (r.ordenInicial || []).map(id => this.datos(id).titulo),
        ordenFinal: this.orden().map(id => this.datos(id).titulo),
        comprobaciones: Number(r.comprobaciones) || 0,
        historialComprobaciones: hist.map(h => ({ correctas: h.correctas, fecha: h.fecha })),
        preguntasAbiertas: registro,
        intentos: fe.intentos.length,
        pistasIntento: it ? it.pistas : 0,
        pistasTotales: fe.pistas.length,
        pistasUtilizadas: fe.pistas.map(p => p.texto),
        fechaInicio: fe.fechaInicio,
        fechaFinalizacion: ahoraISO()
      };
      await api.completar(resultado, { mensaje: texto, permanecer: true });
      zona.innerHTML = `<h3>🎒 Los aprendizajes que llevaré a mi aula</h3>${PreguntasAbiertas.lectura(registro)}
        <button type="button" id="rutaAlMapa" class="btn btn-primario">🗺️ Volver al mapa y descubrir mi siguiente misión</button>`;
      zona.querySelector('#rutaAlMapa').addEventListener('click', () => volverAlMapa());
      toast('📨 ¡Tus respuestas quedaron guardadas!');
    });
  },

  /* ---------- Pistas prácticas ---------- */
  pistaDisponible(api){
    const fe = api.estadoFase;
    if (fe.estado === 'completada' && !intentoAbierto(fe)) return 'Ya completaste esta misión.';
    const v = this.vista;
    if (!v) return 'Primero presiona «¡Reconstruir mi ruta!».';
    if (v.finalizando) return '¡Tu ruta ya está completa!';
    if (v.pistaHasta && Date.now() < v.pistaHasta) return 'Observa la pista anterior antes de pedir otra.';
    if (this.bienColocadas(this.orden()).length === this.orden().length) return 'Todo parece en orden: presiona «Comprobar mi ruta».';
    return true;
  },
  pista(api){
    const v = this.vista; if (!v) return null;
    const o = this.orden(), c = this.correcto(), fijas = this.fijas();
    const st = Object.assign({ n: 0 }, api.respuestas.estadoPistas || {});
    const bien = o.filter((id, i) => c[i] === id && !fijas.has(id));
    const mal = o.filter((id, i) => c[i] !== id);
    let tipo = ['primera', 'correcta', 'posicion'][st.n % 3];
    if (tipo === 'primera' && o[0] === c[0]) tipo = 'correcta';
    if (tipo === 'correcta' && !bien.length) tipo = 'posicion';
    let texto, objetivo = null, posicion = null;
    if (tipo === 'primera') {
      objetivo = c[0]; posicion = 0;
      texto = `La ruta comienza con «${this.datos(c[0]).titulo}». Búscala (va a brillar) y colócala en la posición 1.`;
    } else if (tipo === 'correcta') {
      objetivo = bien[Azar.entero(bien.length)];
      texto = 'La estación que va a brillar ya está en su posición correcta. ¡Déjala ahí!';
    } else {
      objetivo = mal[Azar.entero(mal.length)]; posicion = c.indexOf(objetivo);
      texto = `«${this.datos(objetivo).titulo}» va en la posición ${posicion + 1}. Fíjate en el número que va a brillar.`;
    }
    v.pistaPendiente = { objetivo, posicion };
    api.responder('estadoPistas', { n: st.n + 1 });
    api.registrarEvento(`Pista «${tipo}»`, { estacion: objetivo, posicion });
    return texto;
  },
  alCerrarPista(){
    const v = this.vista; if (!v || !v.pistaPendiente) return;
    const { objetivo, posicion } = v.pistaPendiente; v.pistaPendiente = null;
    const tarjeta = v.cont.querySelector(`.ruta-paso[data-id="${objetivo}"] .ruta-tarjeta`);
    const numero = posicion !== null ? v.cont.querySelectorAll('.ruta-pos')[posicion] : null;
    if (tarjeta) { tarjeta.classList.add('brillo-ruta'); try { tarjeta.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} }
    if (numero) numero.classList.add('objetivo');
    v.pistaHasta = Date.now() + this.DURACION_PISTA;
    this.despues(this.DURACION_PISTA, vv => {
      vv.cont.querySelectorAll('.brillo-ruta').forEach(x => x.classList.remove('brillo-ruta'));
      vv.cont.querySelectorAll('.ruta-pos.objetivo').forEach(x => x.classList.remove('objetivo'));
    });
  },

  /* ---------- Consulta ---------- */
  mostrarConsulta(cont, api){
    const c = this.correcto(), fe = api.estadoFase, res = fe.resultado || {};
    const abiertas = Array.isArray(res.preguntasAbiertas) ? res.preguntasAbiertas : null;
    const pedir = !abiertas && !fe.completadaEnPrueba;
    cont.innerHTML = `
      <div class="tarjeta ruta-panel">
        <p class="sopa-contador">✅ Estaciones correctas: ${c.length} de ${c.length}</p>
        <div class="ruta-inicio">🌱 Inicio del curso</div>
        <ol class="ruta-camino completa recorriendo" id="rutaCamino">${c.map((id, i) => this.htmlPaso(id, i, { fija: true, interactivo: false })).join('')}</ol>
        <div class="ruta-meta">🎓 Futuras maestras</div>
        <button type="button" id="rutaRecorrer" class="btn btn-secundario">▶️ Recorrer mi ruta</button>
      </div>
      ${abiertas ? `<div class="tarjeta"><h3>🎒 Los aprendizajes que llevaré a mi aula</h3>${PreguntasAbiertas.lectura(abiertas)}</div>` : ''}
      ${pedir ? `<div class="tarjeta pa-seccion tarjeta-ampliar" id="rutaAula">
        ${globoAurora(`<p><strong>${esc(primerNombre(api.nombre))}</strong>, ahora esta misión incluye preguntas sobre los aprendizajes que llevarás a tu aula. Tu logro se conserva.</p>`)}
        ${this.htmlFormularioAula((fe.respuestas.borradorAula && fe.respuestas.borradorAula.textos) || [], '📨 Guardar mis respuestas')}
      </div>` : ''}
      <p class="ayuda" style="text-align:center;margin-bottom:12px">Si quieres, puedes usar «Jugar de nuevo»: tu logro original se conserva.</p>`;
    const camino = cont.querySelector('#rutaCamino');
    cont.querySelector('#rutaRecorrer').addEventListener('click', () => { camino.classList.remove('recorriendo'); void camino.offsetWidth; camino.classList.add('recorriendo'); });
    if (pedir) {
      const zona = cont.querySelector('#rutaAula'), error = zona.querySelector('#rutaError'), n = this.PREGUNTAS_AULA.length;
      PreguntasAbiertas.enlazar(zona, n, textos => { error.textContent = ''; fe.respuestas.borradorAula = { textos }; guardarAuto(); });
      zona.querySelector('#rutaGuardarAbiertas').addEventListener('click', async ev => {
        const textos = PreguntasAbiertas.textos(zona, n);
        const k = PreguntasAbiertas.primeraIncompleta(textos);
        if (k >= 0) { error.textContent = `Completa la respuesta ${k + 1} con tus propias palabras antes de guardar.`; zona.querySelector(`[data-pa="${k}"]`).focus(); return; }
        ev.currentTarget.disabled = true;
        const registro = PreguntasAbiertas.registro('ruta', this.PREGUNTAS_AULA, textos);
        iniciarIntento(fe);
        api.responder('preguntasAbiertas', registro);
        api.registrarEvento('Agregó sus respuestas de «Los aprendizajes que llevaré a mi aula» a la misión completada');
        await api.completar(Object.assign({}, fe.resultado, { preguntasAbiertas: registro, fechaPreguntasAbiertas: ahoraISO() }), { actualizarResultado: true, permanecer: true });
        toast('📨 ¡Tus respuestas quedaron guardadas!');
        this.mostrarConsulta(cont, api);
      });
    }
  }
};

registrarMotor('ruta', {
  asignar(){ return { estaciones: Ruta.correcto(), fecha: ahoraISO() }; },
  iniciar(contenedor, api){ Ruta.montar(contenedor, api, false); },
  reiniciar(contenedor, api){ Ruta.montar(contenedor, api, true); },
  pista(api){ return Ruta.pista(api); },
  pistaDisponible(api){ return Ruta.pistaDisponible(api); },
  alCerrarPista(api){ Ruta.alCerrarPista(api); }
});

/* =========================================================
   14. RECORRIDO FINAL (fase 7: «El recorrido de nuestra aventura»)
   Construye los recuerdos SOLO con datos reales guardados:
   juegos completados, logros, fotografías, respuestas
   pedagógicas y momentos (reintentos, pistas, fechas).
   Si una categoría no tiene datos, ese recuerdo se omite.
   La fase 8 (despedida y recuerdo descargable) está en 14.2.
   ========================================================= */
function fechaDia(iso){
  try { return new Date(iso).toLocaleDateString('es-GT', { day:'numeric', month:'long', year:'numeric' }); }
  catch (e) { return ''; }
}

/* Respuestas escritas de una fase: usa el último intento completado */
function respuestasDeFase(faseId){
  const fe = estado.fases[faseId];
  let origen = fe.respuestas || {};
  const ultimo = fe.intentos.slice().reverse().find(i => i.estado === 'completado');
  if (ultimo && ultimo.respuestas && Object.keys(ultimo.respuestas).length) origen = ultimo.respuestas;
  const lista = [];
  Object.keys(origen).forEach(clave => {
    const v = origen[clave];
    if (v && typeof v === 'object' && typeof v.respuesta === 'string' && v.respuesta.trim())
      lista.push({ pregunta: typeof v.pregunta === 'string' ? v.pregunta : '', respuesta: v.respuesta.trim(),
                  palabra: typeof v.palabraMostrada === 'string' ? v.palabraMostrada : '' });
    else if (typeof v === 'string' && v.trim().length >= 3)
      lista.push({ pregunta: '', respuesta: v.trim() });
  });
  return lista;
}

function fotoValida(ev){
  const src = ev && (ev.imagen || ev.dataURL);
  return typeof src === 'string' && /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(src) ? src : null;
}

/* ---------- Libro de recuerdos (motor de la fase 7) ----------
   Reutiliza fotoValida() y lee SOLO los resultados reales guardados por
   cada misión (fe.resultado y estado.evidencias). Si una fase se completó
   en modo de prueba o le faltan datos, lo indica sin inventar contenido.
   Datos del intento (api.respuestas): iniciado, pagina, paginasVistas. */
const RETO_FINAL_ALBUM = 'Un recuerdo para Aurora';   // Si existe, se presenta al final del álbum

const LibroRecuerdos = {
  vista: null,

  /* ---------- Lectura de datos reales ---------- */
  fase(id){ return estado.fases[id]; },
  enPrueba(id){ const fe = this.fase(id); return !!(fe && fe.completadaEnPrueba); },
  resultado(id){ const fe = this.fase(id); return fe && fe.resultado && !fe.completadaEnPrueba ? fe.resultado : null; },

  fotosAlbum(){
    // Fotografías reales de la cacería, en el orden de los retos asignados (dinámico: 5, 10…).
    const res = this.resultado('evidencias');
    const fe = this.fase('evidencias');
    let fotos = [];
    if (res && Array.isArray(res.retos)) {
      const porReto = {};
      res.retos.forEach(r => { porReto[r.retoId || ('#' + r.numero)] = r.evidencia; });
      // Fotografías añadidas en una ampliación aún abierta (misión completada antes con menos retos)
      const abierto = fe && intentoAbierto(fe);
      if (abierto && fe.respuestas && fe.respuestas.ampliacion && fe.respuestas.retos)
        Object.keys(fe.respuestas.retos).forEach(id => { if (!porReto[id]) porReto[id] = fe.respuestas.retos[id].evidencia; });
      const orden = fe && fe.asignacion && Array.isArray(fe.asignacion.retos) ? fe.asignacion.retos : [];
      const claves = orden.filter(id => porReto[id]).concat(Object.keys(porReto).filter(k => !orden.includes(k)));
      fotos = claves.map(k => estado.evidencias.find(ev => ev.id === porReto[k] && ev.fase === 'evidencias'))
        .filter(ev => ev && fotoValida(ev));
    } else {
      fotos = estado.evidencias.filter(ev => ev.fase === 'evidencias' && fotoValida(ev))
        .sort((a, b) => (a.numero || 0) - (b.numero || 0));
    }
    const finales = fotos.filter(ev => ev.reto === RETO_FINAL_ALBUM);
    return fotos.filter(ev => ev.reto !== RETO_FINAL_ALBUM).concat(finales);
  },

  /* ---------- Contenido de cada página ---------- */
  aviso(id){
    if (this.enPrueba(id)) return `<p class="lr-prueba">🧪 Completada en modo de prueba: no hay recuerdos registrados para esta misión.</p>`;
    return `<p class="lr-vacio">No encontramos recuerdos guardados de esta misión.</p>`;
  },
  paginas(){
    const n = esc(primerNombre(estado.nombre));
    const P = [];
    // 1. Palabras escondidas
    (() => {
      const r = this.resultado('sopa');
      const palabras = r && Array.isArray(r.palabrasEncontradas) ? r.palabrasEncontradas : [];
      P.push({ id: 'sopa', emoji: '🔤', titulo: 'Las primeras palabras',
        aurora: 'Todo comenzó con unas palabras escondidas. Cada una nos recordó la importancia de la comunicación.',
        html: palabras.length ? `
          <p class="lr-sub">Las palabras que descubriste:</p>
          <div class="lr-chips">${palabras.map(p => `<span class="lr-chip">${esc(p)}</span>`).join('')}</div>
          ${r.reflexion ? `<div class="cita"><small>Tu reflexión${r.palabraReflexion ? ` sobre «${esc(r.palabraReflexion)}»` : ''}</small>${esc(r.reflexion)}</div>` : ''}`
          : this.aviso('sopa') });
    })();
    // 2. Memoria
    (() => {
      const r = this.resultado('memoria');
      const encontradas = r && Array.isArray(r.parejasEncontradas) ? r.parejasEncontradas : [];
      const parejas = r && Array.isArray(r.parejasAsignadas) ? r.parejasAsignadas.filter(p => encontradas.includes(p.concepto)) : [];
      P.push({ id: 'memoria', emoji: '🧠', titulo: 'Los recuerdos de nuestra memoria',
        aurora: 'Tu memoria encontró cada concepto con su significado. ¡Así se construye el conocimiento!',
        html: parejas.length ? `
          <p class="lr-sub">Las parejas que encontraste:</p>
          <div class="mem-relaciones">${parejas.map((p, i) => `<div class="mem-relacion" style="--fondo-carta:${Memoria.FONDOS[i % Memoria.FONDOS.length]}"><strong>${esc(p.concepto)}</strong><span>↔ ${esc(p.pareja)}</span></div>`).join('')}</div>`
          : this.aviso('memoria') });
    })();
    // 3. Crucigrama
    (() => {
      const r = this.resultado('crucigrama');
      const palabras = r && Array.isArray(r.palabras) ? r.palabras : [];
      P.push({ id: 'crucigrama', emoji: '🧩', titulo: 'El misterio resuelto',
        aurora: 'Pista a pista, resolviste el misterio. Cada palabra completada fue un pequeño logro.',
        html: palabras.length ? `
          <p class="lr-sub">Las ${palabras.length} palabras que completaste:</p>
          <div class="lr-logros">${palabras.map(w => `<div class="lr-logro"><span class="lr-medalla" aria-hidden="true">🏅</span><span><strong>${esc(w.respuesta)}</strong><small>${esc(w.pista || '')}</small></span></div>`).join('')}</div>`
          : this.aviso('crucigrama') });
    })();
    // 4. Álbum de la cacería (dinámico: 5, 10 o las que existan)
    (() => {
      const fotos = this.fotosAlbum();
      P.push({ id: 'evidencias', emoji: '📸', titulo: 'Nuestra galería de recuerdos',
        aurora: fotos.length ? `Mira cuántos momentos especiales capturaste, ${primerNombre(estado.nombre)}. Toca cualquier fotografía para verla en grande.` : 'Este es el lugar de tus fotografías.',
        html: fotos.length ? `
          <p class="lr-sub">${fotos.length === 1 ? '1 fotografía' : `${fotos.length} fotografías`} de tu cacería:</p>
          <div class="lr-album">${fotos.map((ev, i) => `
            <button type="button" class="lr-foto${ev.reto === RETO_FINAL_ALBUM ? ' especial' : ''}" data-foto="${i}" aria-label="Ampliar fotografía: ${esc(ev.reto || `Reto ${i + 1}`)}">
              <img src="${ev.imagen}" alt="" loading="lazy">
              <span class="lr-pie">${ev.reto === RETO_FINAL_ALBUM ? '💌 ' : ''}${esc(ev.reto || `Reto ${i + 1}`)}</span>
            </button>`).join('')}</div>`
          : this.aviso('evidencias'),
        fotos });
    })();
    // 5. Planificación
    (() => {
      const r = this.resultado('planificacion');
      const sits = r && Array.isArray(r.situaciones) ? r.situaciones : [];
      const defensa = r && r.defensa && r.defensa.respuesta;
      P.push({ id: 'planificacion', emoji: '🛡️', titulo: 'Mis decisiones como futura maestra',
        aurora: sits.length ? `Superaste ${sits.length} situaciones pedagógicas pensando siempre en los niños y las niñas.` : 'Aquí se guardan tus decisiones como futura maestra.',
        html: sits.length ? `
          <p class="lr-sub">Situaciones que resolviste:</p>
          <div class="lr-chips">${sits.map(s => `<span class="lr-chip">${esc(s.tema)}</span>`).join('')}</div>
          ${defensa ? `<div class="lr-defensa"><small>Tu estrategia más útil para preprimaria, en tus palabras:</small><blockquote>${esc(defensa)}</blockquote></div>` : ''}
          ${Array.isArray(r.preguntasAbiertas) ? r.preguntasAbiertas.map(x => `<div class="lr-defensa"><small>${esc(x.pregunta)}</small><blockquote>${esc(x.respuesta)}</blockquote></div>`).join('') : ''}`
          : this.aviso('planificacion') });
    })();
    // 6. Ruta
    (() => {
      const r = this.resultado('ruta');
      const titulos = r && Array.isArray(r.ordenFinal) ? r.ordenFinal : [];
      const estaciones = titulos.map(t => BANCO_RETOS.ruta.find(e => e.titulo === t)).filter(Boolean);
      P.push({ id: 'ruta', emoji: '🗺️', titulo: 'Mi ruta de aprendizaje',
        aurora: 'Reconstruiste el camino que recorrimos juntas, desde las primeras palabras hasta convertirte en futura maestra.',
        html: estaciones.length ? `
          <div class="ruta-inicio">🌱 Inicio del curso</div>
          <ol class="ruta-camino completa recorriendo">${estaciones.map((e, i) => Ruta.htmlPaso(e.id, i, { fija: true, interactivo: false })).join('')}</ol>
          <div class="ruta-meta">🎓 Futuras maestras</div>
          ${Array.isArray(r.preguntasAbiertas) ? `<p class="lr-sub" style="margin-top:14px">Los aprendizajes que llevarás a tu aula:</p>${r.preguntasAbiertas.map(x => `<div class="lr-defensa"><small>${esc(x.pregunta)}</small><blockquote>${esc(x.respuesta)}</blockquote></div>`).join('')}` : ''}`
          : this.aviso('ruta') });
    })();
    // Las estaciones siguen el orden de las misiones en FASES
    const pos = id => FASES.findIndex(f => f.id === id);
    P.sort((x, y) => pos(x.id) - pos(y.id));
    return P;
  },

  /* ---------- Entrada del motor ---------- */
  montar(cont, api, esReinicio){
    this.cerrarFoto();
    const fe = api.estadoFase;
    const consulta = fe.estado === 'completada' && !intentoAbierto(fe);
    if (!consulta && !api.respuestas.iniciado) {
      const yaJugo = fe.intentos.some(i => i.respuestas && i.respuestas.iniciado);
      if (!esReinicio && !yaJugo) return this.mostrarIntro(cont, api);
      this.iniciar(api);
    }
    const paginas = this.paginas();
    const total = paginas.length + 1;   // + página final
    const pagina = consulta ? 0 : Math.min(Math.max(0, Number(api.respuestas.pagina) || 0), total - 1);
    this.vista = { cont, api, paginas, total, pagina, consulta, finalizando: false };
    this.pintar(false);
  },
  iniciar(api){
    api.responder('iniciado', true);
    api.responder('pagina', 0);
    api.responder('paginasVistas', 1);
    api.registrarEvento('Abrió su libro de recuerdos');
    api.guardar();
  },
  mostrarIntro(cont, api){
    const n = esc(primerNombre(api.nombre));
    cont.innerHTML = `
      <div class="tarjeta lr-portada">
        <div class="lr-libro" aria-hidden="true"><span>📖</span></div>
        ${globoAurora(`<p>¡<strong>${n}</strong>, hemos llegado a un momento muy especial! Antes de terminar nuestra aventura, quiero que recordemos todo lo que hemos vivido. Cada desafío, cada descubrimiento y cada recuerdo forman parte de tu historia como futura maestra. He preparado algo especialmente para ti. ¿Quieres verlo?</p>`)}
        <button type="button" id="btnLrAbrir" class="btn btn-primario btn-mision">Abrir mi libro de recuerdos</button>
      </div>`;
    cont.querySelector('#btnLrAbrir').addEventListener('click', () => {
      this.iniciar(api);
      this.montar(cont, api, true);
      try { cont.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
  },

  /* ---------- Páginas ---------- */
  pintar(animar){
    const v = this.vista; if (!v) return;
    const i = v.pagina, esFinal = i === v.total - 1;
    const puntos = Array.from({ length: v.total }, (_, k) => `<span class="lr-punto${k === i ? ' actual' : k < i ? ' visto' : ''}"></span>`).join('');
    let cuerpo;
    if (esFinal) {
      const n = esc(primerNombre(estado.nombre));
      cuerpo = `
        <div class="tarjeta lr-pagina lr-final">
          <span class="lr-num">Última página</span>
          ${globoAurora(`<p><strong>${n}</strong>, cuando comenzamos esta aventura, teníamos muchas palabras por descubrir, historias por contar y experiencias por vivir. Hoy puedes mirar hacia atrás y reconocer todo lo que has aprendido. Pero todavía tengo algo muy especial que quiero entregarte...</p>`)}
          <div class="lr-sobre" aria-hidden="true"><span class="lr-sello">✦</span></div>
          ${v.consulta
            ? `<p class="ayuda" style="text-align:center">Ya completaste esta misión. Tu sorpresa te espera en la misión 8.</p>`
            : `<button type="button" id="btnLrFinal" class="btn btn-primario btn-mision">Estoy lista para mi última misión</button>`}
        </div>`;
    } else {
      const p = v.paginas[i];
      cuerpo = `
        <div class="tarjeta lr-pagina">
          <div class="lr-cab"><span class="lr-num">Estación ${i + 1} de ${v.paginas.length}</span><span class="lr-confeti" aria-hidden="true">✨</span></div>
          <h3><span aria-hidden="true">${p.emoji}</span> ${esc(p.titulo)}</h3>
          ${globoAurora(`<p>${esc(p.aurora)}</p>`)}
          <div class="lr-contenido">${p.html}</div>
        </div>`;
    }
    v.cont.innerHTML = `
      <div class="lr-progreso" aria-label="Página ${i + 1} de ${v.total}"><div class="lr-puntos">${puntos}</div><small>Página ${i + 1} de ${v.total}</small></div>
      <div class="lr-hoja${animar ? ' ' + animar : ''}">${cuerpo}</div>
      <div class="fila-botones lr-nav">
        <button type="button" id="btnLrAnterior" class="btn btn-secundario" ${i === 0 ? 'disabled' : ''}>⬅️ Anterior</button>
        <button type="button" id="btnLrSiguiente" class="btn btn-primario" ${esFinal ? 'disabled' : ''}>Siguiente ➡️</button>
      </div>`;
    v.cont.querySelector('#btnLrAnterior').addEventListener('click', () => this.ir(-1));
    v.cont.querySelector('#btnLrSiguiente').addEventListener('click', () => this.ir(1));
    v.cont.querySelectorAll('[data-foto]').forEach(b => b.addEventListener('click', () => this.abrirFoto(+b.dataset.foto)));
    const fin = v.cont.querySelector('#btnLrFinal');
    if (fin) fin.addEventListener('click', () => this.completar(fin));
  },
  ir(paso){
    const v = this.vista; if (!v || v.finalizando) return;
    const nueva = Math.min(Math.max(0, v.pagina + paso), v.total - 1);
    if (nueva === v.pagina) return;
    v.pagina = nueva;
    if (!v.consulta) {
      v.api.responder('pagina', nueva);
